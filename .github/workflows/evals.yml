name: evals

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: evals/uv.lock
      - run: uv sync --locked
      - run: uv run pytest
