      The console prints `NaN` on every tick.

  - id: debugging-03
    type: debugging
    text: |
      This Python function returns the wrong result. Explain the cause
      and how to fix it:

      ```python
      def moving_sum(values, window):
          """Sum of each window of the given size."""
          sums = []
          for i in range(len(values) - window):
              sums.append(sum(values[i : i + window]))
          return sums

      print(moving_sum([1, 2, 3, 4], 2))
      ```

      Expected `[3, 5, 7]`, got `[3, 5]`.

  - id: debugging-04
    type: debugging
    text: |
