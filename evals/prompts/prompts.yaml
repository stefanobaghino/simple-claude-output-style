# The prompt set for answer-pair generation.
#
# Contract:
# - Each prompt has a unique id, a task type, and a text.
# - The task types are the 4 types that the styles target:
#   explanation, code-review, summarization, and debugging.
# - Each prompt is self-contained. The code to review, the text to
#   summarize, and the error output to debug are inline. An answer
#   needs no tools and no repository.
# - Each type holds the same number of prompts. A new prompt continues
#   the <type>-NN numbering and appends at the tail of its type block,
#   so the turn order of the drift sessions stays stable.
#
# Changes to this file change the measurement. The provenance of each
# run records the sha256 of this file.

prompts:
  - id: explanation-01
    type: explanation
    text: |
      Explain how a hash map handles collisions. Cover the two common
      strategies and the trade-off between them. The reader is a junior
      developer.

  - id: explanation-02
    type: explanation
    text: |
      Explain the difference between optimistic locking and pessimistic
      locking in a database. Give one concrete example for each, and
      state when each approach fits.

  - id: explanation-03
    type: explanation
    text: |
      Explain what TCP slow start does and why it exists. The reader
      knows what TCP is but has never read about congestion control.

  - id: explanation-04
    type: explanation
    text: |
      Explain the difference between a process and a thread. Then
      explain when a program benefits from more processes instead of
      more threads, and why.

  - id: explanation-05
    type: explanation
    text: |
      Explain what a memory leak is in a garbage-collected language,
      and how a leak can still happen even though a garbage collector
      runs. Give two common causes.

  - id: explanation-06
    type: explanation
    text: |
      Our API feels slow, and the team wants to add a cache in front of
      the database. Explain whether a cache will help us. We have not
      profiled the service, and we do not know the read-to-write mix.
      The reader is a junior developer.

  - id: explanation-07
    type: explanation
    text: |
      Our single PostgreSQL instance holds about 200 GB, and the
      product team expects growth but cannot say how much. Explain
      whether we should start sharding now. State what the decision
      depends on and what can go wrong on each path.

  - id: explanation-08
    type: explanation
    text: |
      Our service exchanges JSON with its clients, and a colleague
      proposes a switch to a binary format for speed. Explain how much
      improvement we can expect. We have no measurements of the payload
      sizes or of the serialization share of the request time.

