  - id: summarization-01
    type: summarization
    text: |
      Summarize this changelog as release notes for end users. Keep only
      what a user of the application would care about:

      - Bumped internal build tooling to v12.
      - Fixed a crash when the settings dialog was opened while a file
        upload was in progress.
      - Refactored the session module into three smaller modules.
      - Added keyboard shortcuts for the ten most used actions, shown in
        the tooltips of the corresponding buttons.
      - Reduced cold start time by roughly 40% by deferring plugin
        initialization.
      - Updated internal telemetry batching from 30s to 60s intervals.
      - The export dialog now remembers the last used folder.

  - id: summarization-02
    type: summarization
    text: |
      Summarize this incident report into the three most important
      takeaways for the engineering team:

      On Tuesday at 09:14 UTC, the checkout service started returning
      errors for roughly 12% of requests. The on-call engineer was paged
      at 09:21. The errors traced back to a database connection pool
      that was exhausted. A deployment the evening before had lowered
      the pool size from 50 to 5 connections. The value came from a
      configuration template that was copied from the staging
      environment. Staging uses smaller values on purpose. The rollback
      finished at 09:48 and error rates returned to normal. The
      configuration review checklist did not include pool sizes, and the
      staging template and the production template live in the same
      directory with similar names.

  - id: summarization-03
    type: summarization
    text: |
      Summarize this design proposal in one paragraph for a manager who
      has two minutes:

      We propose moving image thumbnail generation out of the upload
      request path and into a background queue. Today, thumbnails are
      generated synchronously during upload, which adds 800ms to 3s to
      each request and ties up web workers. Under the proposal, the
      upload endpoint stores the original image and enqueues a job.
      A worker pool generates the thumbnails and updates the record.
      Until the job completes, clients receive a placeholder URL. The
      change needs a new queue topic, a worker deployment, and a
      placeholder asset. The main risk is a visible delay before
      thumbnails appear under heavy load, which we mitigate with queue
      autoscaling. We estimate two weeks of work for one engineer.

  - id: summarization-04
    type: summarization
    text: |
      Turn this bug report into a ticket: write a one-line title and a
      numbered list of reproduction steps:

      I was using the app yesterday evening on my laptop (Firefox,
      latest version I think) and I wanted to export my monthly report
      like I always do. So I went to the reports page, clicked on
      March, and then clicked the export button, the PDF one, not the
      CSV one which works fine by the way. Nothing happened at first,
      so I clicked it a few more times, and then I got four identical
      error banners at once saying "export failed" with no other
      information. The CSV export of the same report works. My
      colleague sees the same thing on her machine with Chrome.

  - id: summarization-05
    type: summarization
    text: |
      Summarize these meeting notes into a list of action items, each
      with an owner:

      Sprint planning, Monday. Present: Ada, Ben, Chen. Ada walked
      through the migration plan for the payments database and said the
      dry run needs to happen before Thursday. Ben raised that the
      staging environment is still on the old schema and offered to
      update it by Wednesday. Chen asked whether the mobile team was
      informed about the API deprecation, nobody was sure, Ada said she
      would check with their lead. Ben will also prepare the runbook
      for the migration night. Chen continues with the search indexing
      work and expects a demo by Friday.

  - id: debugging-01
    type: debugging
    text: |
      This Python code fails. Explain the cause and how to fix it:

      ```python
      config = {"host": "localhost", "port": 8080}

      def get_url(cfg):
          return f"http://{cfg['host']}:{cfg['Port']}/api"

      print(get_url(config))
      ```

      ```
      Traceback (most recent call last):
        File "app.py", line 6, in <module>
          print(get_url(config))
        File "app.py", line 4, in get_url
          return f"http://{cfg['host']}:{cfg['Port']}/api"
      KeyError: 'Port'
      ```

  - id: debugging-02
    type: debugging
    text: |
      This JavaScript code throws. Explain the cause and how to fix it:

      ```javascript
      class Timer {
        constructor() {
          this.seconds = 0;
        }
        start() {
          setInterval(function () {
            this.seconds += 1;
            console.log(this.seconds);
          }, 1000);
        }
      }
      new Timer().start();
