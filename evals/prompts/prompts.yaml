      likely cause and how to fix it:

      ```python
      def count_lines(path):
          with open(path, encoding="ascii") as f:
              return sum(1 for _ in f)
      ```

      ```
      UnicodeDecodeError: 'ascii' codec can't decode byte 0xc3 in
