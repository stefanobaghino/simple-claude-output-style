  - id: summarization-06
    type: summarization
    text: |
      Summarize this incident review for the engineering newsletter,
      in at most five sentences. Preserve what is known and what is
      still uncertain:

      On March 3rd the checkout service returned errors for roughly
      40 minutes. The on-call engineer suspects connection-pool
      exhaustion in the payments client, but the pool metrics were
      not retained, so this is unconfirmed. A deploy 20 minutes
      before the incident may have contributed: the diff touched
      retry settings, though rollback alone did not restore service.
      Error rates recovered after a restart, which is consistent
      with several possible causes. The team believes, but cannot
      yet show, that a retry storm amplified the outage.

  - id: summarization-07
    type: summarization
    text: |
      Summarize this experiment write-up in one paragraph for the
      team lead. Keep the distinction between what the data shows
      and what is still a guess:

      We compared the new request batcher against the current one on
      the staging cluster for six hours. Median latency dropped 18%,
      which looks solid. Tail latency may also have improved, but
      staging traffic is smoother than production traffic, so the
      p99 numbers are probably optimistic. Memory use per worker
      grew by about 60 MB; we suspect the larger buffer pool, though
      we have not profiled it. One worker crashed once during the
      run. The crash might be unrelated, because staging runs a
      newer kernel, but we cannot rule out a batcher bug yet.

  - id: summarization-08
    type: summarization
    text: |
      Summarize these user-research notes into the three main
      findings for the product team. Mark clearly which findings are
      firm and which are tentative:

      We interviewed eight customers about the new import flow. All
      eight found the field-mapping step, and six completed it
      without help, so the redesign of that step seems to work.
      Three mentioned that the progress bar appears stuck on large
      files; this may be a perception issue, because the uploads did
      finish, but two of the three abandoned the import anyway. A
      few remarks hint that admins and regular users want different
      defaults, though with eight participants we cannot say how
      common that split is. Nobody used the new template gallery,
      which could mean it is hard to find, or just that these
      customers had existing templates.

