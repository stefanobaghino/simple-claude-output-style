  - id: debugging-07
    type: debugging
    text: |
      One test in our suite fails on roughly one CI run in ten, and
      it never fails on a developer machine. The CI log shows only
      the assertion below, and the runner does not keep artifacts.
      What are the most plausible causes, and how would you narrow
      them down?

      ```
      FAILED tests/test_notifications.py::test_digest_contains_all_events
      AssertionError: assert 2 == 3
        digest contained 2 events, expected 3
      ```

      The test seeds three events through the API and then requests
      the digest. CI runs the suite with four parallel workers; a
      developer machine runs it serially. We do not know whether the
      parallelism matters.

  - id: debugging-08
    type: debugging
    text: |
      The memory of our order service grows slowly until the weekly
      restart, and the growth rate differs between weeks. We have no
      heap profile, only these observations. What are the most
      plausible causes, and how would you check each one?

      - Memory grows roughly 2% per day, faster in weeks with
        marketing campaigns.
      - The growth survives quiet nights: usage never returns to the
        morning baseline.
      - A canary instance that receives no webhook traffic grows
        more slowly, but still grows.
      - The service caches product data with a size-bounded cache,
        and the bound has not changed in a year.
