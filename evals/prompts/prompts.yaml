      ```

  - id: debugging-05
    type: debugging
    text: |
      A test passes when it runs alone and fails when the whole suite
      runs. Explain the likely cause and how to fix it:

      ```python
      DEFAULT_TAGS = ["draft"]

      def make_post(title, tags=DEFAULT_TAGS):
          tags.append("post")
          return {"title": title, "tags": tags}

      def test_make_post_adds_post_tag():
          post = make_post("hello")
          assert post["tags"] == ["draft", "post"]
      ```
