        Onboarding explanation. A new engineer joins the checkout team
        next week and will read your text before any document. Explain
        the end-state architecture as the series defines it: how an
        order flows from cart to fulfillment across the services, where
        state lives (RFC-3), how facts and commands move (RFC-2), what
        the platform log is and what projections are, exactly how stock
        checking works at accept time (resolve the runbook-versus-RFC-2
        conflict the way the series' own rules resolve it, and say you
        did), and why the durability requirement shapes all of it. End
        with the five documents they should read first, in order, and
        one sentence on what each will teach them. The glossary below
        is the vocabulary your text may assume.

        Glossary the reader has: monolith, facade, extraction, REST,
        timeout, queue. Glossary the reader lacks (define in your text):
