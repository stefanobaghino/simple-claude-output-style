        ## Deprecation policy restated

        A v1 endpoint may not gain features during the sunset window; bug fixes ship only for defects that block migration. Traffic on each v1 endpoint is reported monthly to the owning team, and an endpoint that reaches zero traffic before the sunset date retires early with two weeks' notice. The 410 responses carry the v2 pointer and the migration doc link permanently, because stale integrations surface for years.

