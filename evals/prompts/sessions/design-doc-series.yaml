        ## Decision

        Commands cross service boundaries as synchronous REST with strict timeouts; facts propagate as asynchronous events on the platform log (one partitioned, replayable topic per owning service). Two rules make the split concrete. First: a service may query another service synchronously only for data the caller cannot cache, and never inside checkout's order-acceptance transaction. Second: inventory levels are facts, not queries - stock changes flow as events, consumers keep a local projection, and no service calls inventory synchronously for a stock check; checkout reserves against its own projection and reconciles on the inventory service's confirmation event. The second rule exists for the durability requirement: order acceptance must not carry a synchronous dependency on another service's uptime.

        ## Alternatives considered

        ### Synchronous REST everywhere

        Every interaction is a call; no event infrastructure. Simplest to trace and the team knows the failure modes.

        Rejected because: checkout would accumulate one synchronous dependency per extracted service, and the availability math fails the durability-first stance of the overview.

        ### Shared message bus for everything

        All interactions, including commands, ride the bus with request-reply correlation. One infrastructure, uniform retry semantics.

        Rejected because: command latency becomes queue-depth dependent, and the January incident taught us not to put an interactive path behind a shared queue.

        ### Direct database sharing for hot reads

        Extracted services keep read access to the monolith cluster for the hottest lookups. Zero extraction cost for read paths.

        Rejected because: it reproduces the undocumented cross-module reads the audit counted, with a network in the middle; RFC-3 forbids it anyway.

        ## Consequences

        - Every service owns a projection of the facts it consumes; projection lag becomes a first-class operational metric.
        - The runbook must document replay procedures per topic, and the capacity plan must size the log retention.
        - Checkout's availability depends only on its own store and the payment provider - the durability requirement's dependency list is now written down.
        - A future sync-query exception needs a superseding RFC, not a code review.

        ## Rollout and measurement

        The decision applies to every extraction that starts after this RFC is accepted; extractions already in flight get a one-quarter grace period and a tracking ticket each. The changelogs of the following quarters must reference this RFC by number for every change the decision governs, so the series stays auditable. The capacity plan and the data-migration plan must restate the decision in their own sections and flag any deviation loudly; a deviation without a superseding RFC is a defect of the series, not a local choice.

