      text: |
        Next document: RFC-3. Summarize the decision and its exact scope:
        what is forbidden, what the sanctioned relief valve is, and why
        the rule is absolute. Note which upcoming documents this RFC
        obligates to restate its rule, and what RFC-2 decided for tables
        whose readers span services.

        # RFC-3: data ownership and storage

        Status: ACCEPTED (review quorum 9 of 9; two review
        rounds; the decision record is the Decision section verbatim)

        ## Context

        This RFC continues the series opened by the ordersuite architecture overview and inherits its constraint set. The order-durability requirement binds every option below: an accepted order is never lost, and any design that makes durability depend on more moving parts must say so explicitly. The January incident and the pain list of the overview are the motivating evidence; RFC-3 narrows one axis of the migration and leaves the others to its siblings.

        ## Decision

        Database per service, no exceptions: each extracted service owns one postgres instance, no two services share a cluster, and no service reads another service's tables through any path. Ownership follows the table map of the architecture overview; a table whose readers span services becomes an event-projected copy in each consumer, per RFC-2. The rule is absolute on purpose: the January incident was a shared-cluster incident, the pain list counts capacity coupling as a first-class cost, and a cost-driven exception today becomes an architectural fact tomorrow. If cost pressure arrives, the sanctioned relief valve is smaller instances, never shared ones.

        ## Alternatives considered

        ### Shared cluster, separate schemas

        One managed cluster, one schema per service, grants enforce the boundaries. Half the instance cost and one backup story.

        Rejected because: capacity stays coupled - the exact pain the overview lists - and grant discipline erodes; the audit's 41 undocumented reads all began as temporary grants.

        ### One big cluster with row-level ownership

        Keep the monolith cluster; tag rows by owning service. No migration cost at all.

        Rejected because: it is the status quo wearing a label; every listed pain survives.

        ### Polyglot per workload

        Let each team choose its store: document stores for catalog, a ledger store for orders. Best tool per shape of data.

        Rejected because: the platform inherits N operational stories during a migration that already runs two systems in parallel; revisit after the program completes.

        ## Consequences

        - Instance count grows with the fleet; the capacity plan carries a per-service sizing table and the cost curve.
        - Cross-service joins disappear; reporting rebuilds on projections, and the reporting module's extraction gains a quarter.
        - Backup and restore become per-service drills in the runbook.
        - The data-migration plan must restate this rule and inventory every table against it.

        ## Rollout and measurement

        The decision applies to every extraction that starts after this RFC is accepted; extractions already in flight get a one-quarter grace period and a tracking ticket each. The changelogs of the following quarters must reference this RFC by number for every change the decision governs, so the series stays auditable. The capacity plan and the data-migration plan must restate the decision in their own sections and flag any deviation loudly; a deviation without a superseding RFC is a defect of the series, not a local choice.

