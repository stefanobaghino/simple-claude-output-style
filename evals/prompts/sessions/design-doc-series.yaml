        ## Why the monolith has to split (the pain list)

        Deploys serialize: fifteen modules ship as one artifact, and the slowest test suite gates every team. The shared schema means a migration in catalog locks tables that checkout reads, and the January price-book migration held order acceptance for 11 minutes - the incident that funded this series. Capacity is coupled: reporting queries compete with checkout writes on the same cluster every quarter close. Team ownership is blurred: the audit found 41 cross-module table reads that no interface documents.

        The series that follows this document decides the decomposition strategy (RFC-1), the communication style between the extracted services (RFC-2), and the data ownership rules (RFC-3), then tracks execution through the quarterly changelogs, the capacity plan, the data-migration plan, the API deprecation notice, and the operations runbook. Each document restates the order-durability requirement in its own terms; a reviewer of the whole series should be able to follow that single requirement end to end.

        ## The platform log

        One topic per owning service, partitioned by aggregate id, retention 30 days, replay throughput sized so a full projection rebuild of the largest consumer finishes inside four hours. The log is the availability boundary of RFC-2: it can lag without stopping checkout, and the alerting section of the runbook treats projection lag as the primary consumer signal.

        ## The monolith during the program

        The monolith keeps its cluster until the order path leaves; the shared-cluster QPS line of the changelogs tracks the drawdown. Reporting remains the largest residual load; its extraction waits for projections per RFC-3's consequences, and quarter closes stay on the watch list until then.

        ## Scenario analyses

        Seasonal peak with one extraction in flight: dual-writes double the write amplification on the tables in phase 2 of the migration plan. The plan reserves the amplification budget explicitly, and an extraction freezes two weeks before the peak.

        Marketplace launch overshoot: catalog reads exceed forecast by more than 40 percent. Catalog-service scales reads on replicas without touching any other service - the RFC-3 dividend the plan is designed around.

