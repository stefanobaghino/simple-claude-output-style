        5. Confirm order acceptance is unaffected; the durability requirement gates every drill.
        6. Record timings in the drill log; the plan's review reads them quarterly.
        7. Announce in the migration channel and freeze the phase board.
        8. Run the checksum harness in compare-only mode.
        9. Record timings in the drill log; the plan's review reads them quarterly.

        ### Drill: write cut reversal (inside the window)

        1. Confirm order acceptance is unaffected; the durability requirement gates every drill.
        2. Record timings in the drill log; the plan's review reads them quarterly.
        3. Watch divergence and lag dashboards for fifteen minutes.
        4. Record timings in the drill log; the plan's review reads them quarterly.
