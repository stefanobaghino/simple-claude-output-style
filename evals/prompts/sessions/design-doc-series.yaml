        ## Questions from the review, with answers

        **What happens to a table with two writers behind different facades?**

        Phase 1 blocks it: the census ticket must reduce it to one writer before phase 2 starts for that table.

        **Can a team skip shadow reads for a low-risk table?**

        No; the phase 4 entry criteria are uniform. A low-risk table simply passes the week faster.

        **Who arbitrates when divergence is explained but nonzero?**

        The migration lead, with the owning team; the freeze rule applies until the arbitration is recorded.

        **Does the plan cover the reporting module?**

        Only its tables; the module's extraction waits for projections per RFC-3's consequences, as the capacity plan restates.

        **How do the order tables' stricter rules interact with change windows?**

        Their write cuts take the longest window of the quarter and a rehearsed rollback is an entry criterion, not an option.

        **Is the storage exception for the small catalogs a precedent?**

        The plan marks it for review at program end; nothing in this document makes it repeatable.

        **What stops a phase from starting during the seasonal freeze?**

        The entry criteria include the no-freeze check, and the capacity plan's peak clause freezes extractions two weeks before the peak; the change windows in the schedule table already exclude the freeze weeks.


