        ### checkout-service

        The checkout-service instance carries 5 tables from the inventory of the migration plan and serves 1 projections per RFC-2. Its peak follows checkout's, so its headroom factor matches the order path's. The sizing row above restates the RFC-3 rule for it: its own instance, never a shared cluster.

        ### orders-service

        The orders-service instance carries 7 tables from the inventory of the migration plan and serves 5 projections per RFC-2. Its workload is batch-shaped; the instance is sized for the nightly window, not the daily mean. The sizing row above restates the RFC-3 rule for it: its own instance, never a shared cluster.

        ### fulfillment-service

        The fulfillment-service instance carries 9 tables from the inventory of the migration plan and serves 2 projections per RFC-2. Its projection rebuild is the largest of the fleet and bounds the four-hour replay budget. The sizing row above restates the RFC-3 rule for it: its own instance, never a shared cluster.

        ### returns-service

        The returns-service instance carries 9 tables from the inventory of the migration plan and serves 4 projections per RFC-2. Its workload is batch-shaped; the instance is sized for the nightly window, not the daily mean. The sizing row above restates the RFC-3 rule for it: its own instance, never a shared cluster.

