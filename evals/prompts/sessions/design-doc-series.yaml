        ## Per-service notes

        ### catalog-service

        The catalog-service instance carries 5 tables from the inventory of the migration plan and serves 1 projections per RFC-2. Its peak is read-dominated; replicas absorb growth without resizing the primary. The sizing row above restates the RFC-3 rule for it: its own instance, never a shared cluster.

        ### pricing-service

        The pricing-service instance carries 4 tables from the inventory of the migration plan and serves 4 projections per RFC-2. Its workload is batch-shaped; the instance is sized for the nightly window, not the daily mean. The sizing row above restates the RFC-3 rule for it: its own instance, never a shared cluster.

        ### inventory-service

        The inventory-service instance carries 2 tables from the inventory of the migration plan and serves 2 projections per RFC-2. Its projection rebuild is the largest of the fleet and bounds the four-hour replay budget. The sizing row above restates the RFC-3 rule for it: its own instance, never a shared cluster.

        ### cart-service

