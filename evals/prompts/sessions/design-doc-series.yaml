        ## Phases

        ### Phase 1: inventory freeze and table census

        The table map of the overview is re-verified against production; every undocumented reader found by the audit gets a ticket blocking its table's phase 3.

        Entry criteria:

        - divergence metrics stayed under threshold for seven consecutive days
        - the capacity plan carries the phase's amplification budget for the window
        - the previous phase's exit review is signed by the owning team and platform
        Exit criteria:

        - the owning team's on-call has run the new pages once
        - the changelog entry citing the governing RFC is merged
        - checksums pass at the phase's verification level

        ### Phase 2: dual-write

        The monolith writes to both stores; divergence metrics per table, alert at 0.01 percent.

        Entry criteria:

        - the capacity plan carries the phase's amplification budget for the window
        - no fleet-wide freeze is active (see the verification section)
        - the capacity plan carries the phase's amplification budget for the window
        Exit criteria:

        - alerting for the next phase is live and tested
        - the changelog entry citing the governing RFC is merged
        - alerting for the next phase is live and tested

        ### Phase 3: backfill

        Chunked copy with checksums; order tables at 100 percent verification per the durability requirement.

        Entry criteria:

        - the previous phase's exit review is signed by the owning team and platform
        - no fleet-wide freeze is active (see the verification section)
        - the rollback drill for this phase was rehearsed in staging within the last month
        Exit criteria:

        - checksums pass at the phase's verification level
        - the shadow comparison shows zero unexplained mismatches for a week
        - alerting for the next phase is live and tested

        ### Phase 4: read cut

        Consumers move to the new store behind flags; one week of shadow-read comparison first.

        Entry criteria:

        - divergence metrics stayed under threshold for seven consecutive days
        - the rollback drill for this phase was rehearsed in staging within the last month
        - the previous phase's exit review is signed by the owning team and platform
        Exit criteria:

        - checksums pass at the phase's verification level
        - the shadow comparison shows zero unexplained mismatches for a week
        - the owning team's on-call has run the new pages once

        ### Phase 5: write cut

        The point of no return per table; scheduled in change windows with the rollback drill rehearsed.

        Entry criteria:

        - the capacity plan carries the phase's amplification budget for the window
        - divergence metrics stayed under threshold for seven consecutive days
        - the previous phase's exit review is signed by the owning team and platform
        Exit criteria:

        - the changelog entry citing the governing RFC is merged
        - alerting for the next phase is live and tested
        - checksums pass at the phase's verification level

        ### Phase 6: retirement

        Monolith tables become read-only archives, dropped after the retention the compliance appendix sets.

        Entry criteria:

        - no fleet-wide freeze is active (see the verification section)
        - no fleet-wide freeze is active (see the verification section)
        - the rollback drill for this phase was rehearsed in staging within the last month
        Exit criteria:

        - alerting for the next phase is live and tested
        - the shadow comparison shows zero unexplained mismatches for a week
        - checksums pass at the phase's verification level

