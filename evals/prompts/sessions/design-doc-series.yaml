        # API deprecation notice: ordersuite public v1

        The v1 public API of the monolith retires as the extracted services publish their own v2 endpoints. Sunset date for every v1 endpoint: 2026-03-31; after that date v1 returns 410 with a migration pointer per endpoint. Partners received individual notices; this document is the canonical list.

