        # Operations runbook: the service fleet (draft for the end state)

        This runbook covers the fleet the migration produces: twelve services, per-service postgres, the platform log, and the monolith remnant until its retirement. Procedures assume the RFC-2 communication rules; where a procedure touches order acceptance, the durability requirement is restated inline.

        ## Procedures

        ### Projection lag on any consumer

        1. Confirm lag on the consumer's projection metric, not the log's.
        2. Identify the topic and the consumer group.
        3. If lag grows during replay, apply the 60 percent rate cap.
        4. If lag grows under normal load, scale the consumer before the log.
        5. Escalate to the owning team when lag crosses its SLO.
        Verification: confirm no order acceptance impact in the window; the durability requirement makes that check unconditional, whatever the procedure.

        ### Checkout availability drop

        1. Check checkout-service's own store first: durability before availability means checkout refuses orders when its store is in doubt.
        2. Check inventory-service latency next: checkout calls inventory synchronously for the stock check at accept time with a 250 ms timeout, so inventory p99 above 250 ms shows up directly as checkout accept failures.
        3. If inventory is the driver, scale inventory-service reads before touching checkout.
        4. Do not restart checkout instances while accepts are in flight; drain first.
        5. Page the payments provider bridge if authorization latency is the driver.
        Verification: record the drill or response in the failover log; the quarterly capacity review reads the timings and the changelog links the entry.

        ### Platform log partition unavailable

        1. Producers buffer locally up to the documented bound.
        2. Consumers serve stale projections and must not fail closed, except checkout's reserve path which follows its own rule.
        3. Coordinate replay after recovery; cap rates per the capacity plan.
        Verification: record the drill or response in the failover log; the quarterly capacity review reads the timings and the changelog links the entry.

        ### Per-service postgres failover

        1. Each service owns its instance (RFC-3), so failover is a per-service drill.
        2. Run the drill from the service's own runbook page; the fleet page only coordinates.
        3. Order tables: verify the last accepted order id against the payment provider's record before reopening.
        Verification: confirm no order acceptance impact in the window; the durability requirement makes that check unconditional, whatever the procedure.

        ### Monolith remnant deploy

        1. The remnant still gates on its shrinking test suite.
        2. Facade changes require the paired service team's review.
        3. A remnant rollback rolls back every facade it carries; check the changelog for the quarter's facade list.
        Verification: record the drill or response in the failover log; the quarterly capacity review reads the timings and the changelog links the entry.

        ### Backfill checksum divergence

        1. Divergence after a write cut freezes the migration fleet-wide.
        2. Page the owning team; the migration plan's verification section governs.
        3. Order tables divergence is a severity 1 regardless of row count.
        Verification: confirm no order acceptance impact in the window; the durability requirement makes that check unconditional, whatever the procedure.

        ### Partner reports a v1 breakage

        1. Check the deprecation table for the endpoint's status.
        2. During the sunset window, v1 defects that block migration are fixed; feature requests are declined with the v2 pointer.
        3. After sunset, the 410 carries the migration link.
        Verification: confirm no order acceptance impact in the window; the durability requirement makes that check unconditional, whatever the procedure.

        ### Shadow-read mismatch during a phase 4 week

        1. Confirm the mismatch is not a flag flip mid-comparison (see known false alarms).
        2. Freeze the table's phase board and page the owning team.
        3. Run the checksum harness in compare-only mode on the affected chunks.
        4. The migration plan's arbitration rule governs explained nonzero divergence.
        Verification: confirm no order acceptance impact in the window; the durability requirement makes that check unconditional, whatever the procedure.

        ### Facade consumer count disagrees with the inventory

        1. Regenerate the inventory; the generator reads live routing.
        2. If the disagreement survives, a consumer bypassed the facade - treat as an undocumented read and open the audit ticket.
        3. Retirement tickets block on a zero count from the regenerated inventory, not the published one.
        Verification: confirm no order acceptance impact in the window; the durability requirement makes that check unconditional, whatever the procedure.

        ### Quarter-close reporting pressure

        1. Reporting still reads the remnant cluster until its extraction.
        2. Throttle report jobs before touching any service instance.
        3. The capacity plan's monolith section carries the watch list.
        Verification: close the page only when the primary signal is green for fifteen minutes and the actions taken are logged in the incident channel with timestamps.

