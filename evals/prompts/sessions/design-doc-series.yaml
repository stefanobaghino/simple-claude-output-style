# One coherent deep drift session. Contract:
#
# - `session.id` names the script, and the file name matches
#   "<id>.yaml".
# - `turns` is the ordered turn list. Every turn has a unique id and
#   a self-contained text: an answer needs no tools and no
#   repository.
# - Every script in prompts/sessions/ has the same turn count,
#   because the drift analysis pools by turn position across
#   sessions.
# - Later turns reference material from earlier turns by artifact
#   name, so the model must read deep context.
# - Changes to this file change the measurement. The provenance of a
#   deep run records the sha256 of every script file.

session:
  id: design-doc-series
  description: A monolith-to-services migration told through its document series.
  turns:
    - id: turn-01
      text: |
        You are reviewing the document series of a monolith-to-services
        migration, one document per turn. Summarize the architecture
        overview below: the module map, the data-ownership situation, the
        pain points that motivate the migration, and the one requirement
        the series says every later document must preserve. You will track
        that requirement across the whole series.

        # ordersuite architecture overview (v14, the last monolith edition)

        ordersuite is the commerce monolith: one deployable, one postgres
        cluster, fifteen modules behind one process boundary. This
        document is the baseline the migration series measures against.
        The one requirement every later document must preserve, stated
        here first: an accepted order is never lost. Checkout trades
        availability for durability - when the order store is in doubt,
        checkout refuses new orders rather than accept one it might drop.

        ## Modules

        ### catalog

        The catalog module owns product definitions, categories, attributes, search feeds. It exposes 17 internal interfaces to the other modules and 0 public endpoints under /api/v1. State lives in 1 of the shared tables, and 1 scheduled jobs keep the derived data fresh. Its hot paths are annotated in the capacity baseline table.

        ### pricing

        The pricing module owns price books, promotions, tax rules, currency tables. It exposes 17 internal interfaces to the other modules and 2 public endpoints under /api/v1. State lives in 3 of the shared tables, and 3 scheduled jobs keep the derived data fresh. The module reaches into tables other modules own; the data ownership section below lists every such reach.

        ### inventory

        The inventory module owns stock levels, reservations, warehouse sync. It exposes 13 internal interfaces to the other modules and 0 public endpoints under /api/v1. State lives in 2 of the shared tables, and 4 scheduled jobs keep the derived data fresh. Two of its interfaces exist only for the admin module and are candidates for retirement rather than extraction.

        ### cart

        The cart module owns cart state, merges, expiry, gift options. It exposes 16 internal interfaces to the other modules and 8 public endpoints under /api/v1. State lives in 3 of the shared tables, and 5 scheduled jobs keep the derived data fresh. Two of its interfaces exist only for the admin module and are candidates for retirement rather than extraction.

        ### checkout

        The checkout module owns order acceptance, payment orchestration, receipts. It exposes 12 internal interfaces to the other modules and 4 public endpoints under /api/v1. State lives in 1 of the shared tables, and 1 scheduled jobs keep the derived data fresh. Its hot paths are annotated in the capacity baseline table.

        ### orders

        The orders module owns order lifecycle, amendments, cancellations. It exposes 11 internal interfaces to the other modules and 5 public endpoints under /api/v1. State lives in 4 of the shared tables, and 4 scheduled jobs keep the derived data fresh. The module reaches into tables other modules own; the data ownership section below lists every such reach.

        ### fulfillment

        The fulfillment module owns shipment planning, carrier selection, tracking. It exposes 12 internal interfaces to the other modules and 2 public endpoints under /api/v1. State lives in 2 of the shared tables, and 2 scheduled jobs keep the derived data fresh. Cross-module calls are plain function calls today, which is exactly the coupling the migration has to make explicit.

        ### returns

        The returns module owns return authorizations, refunds, restocking. It exposes 6 internal interfaces to the other modules and 5 public endpoints under /api/v1. State lives in 2 of the shared tables, and 2 scheduled jobs keep the derived data fresh. Its hot paths are annotated in the capacity baseline table.

        ### customers

        The customers module owns profiles, addresses, consent, preferences. It exposes 12 internal interfaces to the other modules and 8 public endpoints under /api/v1. State lives in 2 of the shared tables, and 4 scheduled jobs keep the derived data fresh. Two of its interfaces exist only for the admin module and are candidates for retirement rather than extraction.

        ### notifications

        The notifications module owns email, push, and webhook fan-out. It exposes 15 internal interfaces to the other modules and 8 public endpoints under /api/v1. State lives in 3 of the shared tables, and 5 scheduled jobs keep the derived data fresh. Its hot paths are annotated in the capacity baseline table.

        ### reporting

        The reporting module owns finance exports, sales rollups, dashboards. It exposes 9 internal interfaces to the other modules and 7 public endpoints under /api/v1. State lives in 2 of the shared tables, and 4 scheduled jobs keep the derived data fresh. Two of its interfaces exist only for the admin module and are candidates for retirement rather than extraction.

        ### admin

        The admin module owns back-office UI endpoints and bulk tools. It exposes 14 internal interfaces to the other modules and 8 public endpoints under /api/v1. State lives in 2 of the shared tables, and 4 scheduled jobs keep the derived data fresh. Its hot paths are annotated in the capacity baseline table.

        ### search

        The search module owns query parsing, ranking, suggestion feeds. It exposes 18 internal interfaces to the other modules and 7 public endpoints under /api/v1. State lives in 3 of the shared tables, and 6 scheduled jobs keep the derived data fresh. Two of its interfaces exist only for the admin module and are candidates for retirement rather than extraction.

        ### media

        The media module owns product images, renditions, CDN invalidation. It exposes 18 internal interfaces to the other modules and 7 public endpoints under /api/v1. State lives in 3 of the shared tables, and 5 scheduled jobs keep the derived data fresh. Two of its interfaces exist only for the admin module and are candidates for retirement rather than extraction.

        ### integrations

        The integrations module owns ERP sync, marketplace feeds, partner APIs. It exposes 11 internal interfaces to the other modules and 3 public endpoints under /api/v1. State lives in 3 of the shared tables, and 6 scheduled jobs keep the derived data fresh. The module reaches into tables other modules own; the data ownership section below lists every such reach.


        ## Interface census (the calls that become network calls)

        ### catalog interfaces

        - `catalog.apply_product()`: called by reporting only from the admin bulk tools.
        - `catalog.invalidate_feeds()`: called by customers from a scheduled job, hourly.
        - `catalog.compute_attributes()`: called by inventory only from the admin bulk tools.
        - `catalog.list_product()`: called by inventory with results cached for five minutes by the caller.
        - `catalog.compute_feeds()`: called by returns from a scheduled job, hourly.
        - `catalog.list_product()`: called by reporting synchronously inside a transaction - flagged for RFC-2.
        - `catalog.get_feeds()`: called by search synchronously inside a transaction - flagged for RFC-2.

