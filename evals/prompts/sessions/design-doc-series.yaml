        # RFC-1: decomposition strategy

        Status: ACCEPTED (review quorum 5 of 9; two review
        rounds; the decision record is the Decision section verbatim)

        ## Context

        This RFC continues the series opened by the ordersuite architecture overview and inherits its constraint set. The order-durability requirement binds every option below: an accepted order is never lost, and any design that makes durability depend on more moving parts must say so explicitly. The January incident and the pain list of the overview are the motivating evidence; RFC-1 narrows one axis of the migration and leaves the others to its siblings.

        ## Decision

        We migrate by strangler fig: extractions happen one service at a time, each behind a facade in the monolith, and the monolith remains the deployable of record until the last facade retires. Extraction order follows blast radius, smallest first: catalog, pricing, inventory, then the order path (cart, checkout, orders), then the long tail. The order path moves last on purpose: the durability requirement concentrates there, and the team refuses to move it until the pattern is proven twice on low-risk services.

        ## Alternatives considered

        ### Big-bang rewrite

        Build the service fleet in parallel, switch traffic in one cutover window, retire the monolith the same quarter. The estimate came to 14 team-quarters with a single cutover of every workflow at once.

        Rejected because: the cutover concentrates every risk on one night, and the durability requirement cannot be rehearsed incrementally.

        ### Modular monolith

        Keep one deployable but enforce module boundaries with build tooling and per-module schemas inside the process. This fixes the ownership blur and part of the deploy serialization at a fraction of the cost.

        Rejected because: it leaves the shared cluster and the capacity coupling in place, and the January incident class survives unchanged.

        ### Extract only the order path

        Move cart, checkout, and orders out; leave the rest inside the monolith indefinitely. The riskiest workload would get isolation first.

        Rejected because: it inverts the learning curve: the team would practice the hardest extraction first, against the requirement that tolerates the least error.

        ## Consequences

        - Every extraction ships a facade and a retirement ticket for it; facade count is a first-class metric in the changelogs.
        - The monolith's test gate shrinks as modules leave; the overview's deploy-serialization pain retires gradually, not at once.
        - Two systems run for the whole program; the capacity plan must budget both.
        - The order-durability requirement stays inside the monolith longest, by design.

        ## Rollout and measurement

        The decision applies to every extraction that starts after this RFC is accepted; extractions already in flight get a one-quarter grace period and a tracking ticket each. The changelogs of the following quarters must reference this RFC by number for every change the decision governs, so the series stays auditable. The capacity plan and the data-migration plan must restate the decision in their own sections and flag any deviation loudly; a deviation without a superseding RFC is a defect of the series, not a local choice.

