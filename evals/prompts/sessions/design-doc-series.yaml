        ## Why the monolith has to split (the pain list)

        Deploys serialize: fifteen modules ship as one artifact, and the slowest test suite gates every team. The shared schema means a migration in catalog locks tables that checkout reads, and the January price-book migration held order acceptance for 11 minutes - the incident that funded this series. Capacity is coupled: reporting queries compete with checkout writes on the same cluster every quarter close. Team ownership is blurred: the audit found 41 cross-module table reads that no interface documents.

        The series that follows this document decides the decomposition strategy (RFC-1), the communication style between the extracted services (RFC-2), and the data ownership rules (RFC-3), then tracks execution through the quarterly changelogs, the capacity plan, the data-migration plan, the API deprecation notice, and the operations runbook. Each document restates the order-durability requirement in its own terms; a reviewer of the whole series should be able to follow that single requirement end to end.
