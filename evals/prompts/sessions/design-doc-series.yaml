        Next document: the capacity plan. Summarize the sizing approach,
        how the durability requirement appears as a sizing rule, what the
        plan says about the platform log and the monolith remnant, and
        which RFC-3 clause the cost-curve section restates. Keep the
        per-service table in mind for the migration guide later.

        # Capacity plan for the service fleet (mid-migration edition)

        This plan sizes the fleet the RFCs imply: per-service postgres instances (RFC-3), the platform log (RFC-2), and the shrinking monolith running beside them (RFC-1). Forecast basis: last year's traffic with the growth curve finance signed, peak factor 3.1 at the seasonal spike, and the marketplace launch adding 20 percent to catalog reads. The durability requirement appears here as a sizing rule: checkout's store is sized for zero write-shedding at twice the peak forecast.

        ## Per-service sizing

        service | store | peak qps | p99 target | instance | headroom
        catalog-service | postgres (own instance, RFC-3) | 2132 | 80 ms | m-2 | 2.0x
        pricing-service | postgres (own instance, RFC-3) | 428 | 80 ms | m-8 | 2.0x
        inventory-service | postgres (own instance, RFC-3) | 5683 | 50 ms | m-8 | 2.5x
        cart-service | postgres (own instance, RFC-3) | 6307 | 120 ms | m-4 | 2.5x
        checkout-service | postgres (own instance, RFC-3) | 2742 | 120 ms | m-8 | 2.0x
        orders-service | postgres (own instance, RFC-3) | 3790 | 120 ms | m-8 | 2.5x
        fulfillment-service | postgres (own instance, RFC-3) | 616 | 120 ms | r-4 | 2.0x
        returns-service | postgres (own instance, RFC-3) | 1467 | 50 ms | m-2 | 2.5x
