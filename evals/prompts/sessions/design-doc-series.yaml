        ## Glossary for this RFC

        - **facade**: the monolith endpoint that fronts an extracted service during the strangler migration.
        - **grace period**: one quarter in which an in-flight extraction may finish under the old rules, with a ticket.
        - **durability requirement**: an accepted order is never lost; durability outranks availability at checkout.
        - **projection**: a consumer-owned copy of another service's facts, built from events.
        - **write cut**: the migration step after which the new store is the only writer for a table.
        - **series**: the ordered document set from the architecture overview to the operations runbook.

