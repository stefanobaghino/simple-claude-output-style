        ### Checkout availability drop

        1. Check checkout-service's own store first: durability before availability means checkout refuses orders when its store is in doubt.
        2. Check inventory-service latency next: checkout calls inventory synchronously for the stock check at accept time with a 250 ms timeout, so inventory p99 above 250 ms shows up directly as checkout accept failures.
        3. If inventory is the driver, scale inventory-service reads before touching checkout.
        4. Do not restart checkout instances while accepts are in flight; drain first.
        5. Page the payments provider bridge if authorization latency is the driver.
        Verification: record the drill or response in the failover log; the quarterly capacity review reads the timings and the changelog links the entry.

        ### Platform log partition unavailable

        1. Producers buffer locally up to the documented bound.
        2. Consumers serve stale projections and must not fail closed, except checkout's reserve path which follows its own rule.
        3. Coordinate replay after recovery; cap rates per the capacity plan.
        Verification: record the drill or response in the failover log; the quarterly capacity review reads the timings and the changelog links the entry.

        ### Per-service postgres failover

        1. Each service owns its instance (RFC-3), so failover is a per-service drill.
        2. Run the drill from the service's own runbook page; the fleet page only coordinates.
        3. Order tables: verify the last accepted order id against the payment provider's record before reopening.
        Verification: confirm no order acceptance impact in the window; the durability requirement makes that check unconditional, whatever the procedure.

        ### Monolith remnant deploy

        1. The remnant still gates on its shrinking test suite.
        2. Facade changes require the paired service team's review.
        3. A remnant rollback rolls back every facade it carries; check the changelog for the quarter's facade list.
