        ## FAQ

        **Why a hard sunset instead of best-effort?**

        A live v1 endpoint is a live facade in the monolith; RFC-1 measures the program by facade retirement, and an open-ended v1 keeps the monolith deployable forever.

        **What happens to v1 webhooks?**

        Webhook deliveries move to notification-service with the same payloads; only the signing key rotates.

        **Can a partner get an extension?**

        Extensions exist per endpoint, not per partner, and require the owning team plus platform sign-off before the sunset quarter starts.

        **Does the sunset affect order durability?**

        No: order acceptance already flows through checkout-service; the v1 checkout endpoint has proxied since the Q2 milestone.

        **Where do I test v2?**

        The partner sandbox serves every v2 endpoint with production shapes and synthetic data refreshed nightly.

        **Who do I contact?**

        The owning team in the endpoint table; the platform channel for anything spanning two services.

