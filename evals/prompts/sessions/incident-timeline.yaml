      text: |
        Two draft root-cause memos are circulating; they disagree. Evaluate
        both against the artifacts by name: the cache fleet metrics, the
        connection-pool trace, the postgres slow-query log, the production
        config diff, the retry-queue metrics, and the on-call chat export.
        For each memo, list which claims the evidence supports and which it
        contradicts, then state which root cause the evidence establishes.
        The evidence appendix, the figure table, and the board questions
        below are part of the material: use them, and correct any reading
        in the appendix that misstates an artifact.

        ### Draft RCA memo: cache-node failure cascade
        Author: chen.wu

        **Summary**

        The checkout outage was a delayed cascade from the cache-3 failure at 13:50. When cache-3 went down, session and cart reads fell back to the database per the configured fallback. The extra read load warmed slowly because sessions expire over an hour, so the database pressure peaked long after the node recovered, which explains the 45-minute gap before the first 504s. The dashboards for the period are archived under the incident record, and every figure quoted here is taken from the artifacts circulated during the response, so the reader can verify each claim against the same data without access to the live systems.

        **Supporting evidence**

        The orders-service error log shows cache.client failures with database fallback from 13:50 to 14:10. The fallback path is confirmed in the production config (cache.fallback = database). Checkout latency rose within the hour that session TTLs (3600 s) would predict for re-warming. The dashboards for the period are archived under the incident record, and every figure quoted here is taken from the artifacts circulated during the response, so the reader can verify each claim against the same data without access to the live systems.

        **Weaknesses acknowledged**

        The cache fleet metrics show hit rates fully recovered by 14:10, and the postgres slow-query log shows no elevated statement durations at any point, which this memo attributes to the slow-query threshold hiding aggregate load. The dashboards for the period are archived under the incident record, and every figure quoted here is taken from the artifacts circulated during the response, so the reader can verify each claim against the same data without access to the live systems.

        **Proposed remediation**

        Add cache-node redundancy per shard and pre-warm caches after node recovery, so a fallback window cannot build a delayed database debt. The dashboards for the period are archived under the incident record, and every figure quoted here is taken from the artifacts circulated during the response, so the reader can verify each claim against the same data without access to the live systems.


        ### Draft RCA memo: pool misconfiguration in v2025.11.04.1
        Author: dana.reyes

        **Summary**

        The outage began within three minutes of the orders-service deploy at 14:32:05. The production config diff of that deploy reduced database.pool max_connections from 50 to 10. With peak checkout concurrency near 18 connections, the pool saturated immediately, and every request beyond 10 waited up to the 5000 ms acquire timeout before failing. The dashboards for the period are archived under the incident record, and every figure quoted here is taken from the artifacts circulated during the response, so the reader can verify each claim against the same data without access to the live systems.

        **Supporting evidence**

        The connection-pool trace shows size dropping 50 to 10 at 14:32 with waiters climbing to 44 and wait_p99_ms pinned at 5000. The error log's PoolTimeout lines name pool size 10 explicitly. The postgres slow-query log stays fast throughout, which rules out the database itself. Recovery followed the 15:24 rollback within three minutes. The dashboards for the period are archived under the incident record, and every figure quoted here is taken from the artifacts circulated during the response, so the reader can verify each claim against the same data without access to the live systems.

        **On the cache theory**

        The cache-3 window (13:50-14:10) ended 25 minutes before onset, hit rates were normal after recovery per the cache fleet metrics, and no error-log fallback lines appear after 14:10, so the cascade mechanism has no evidence in the artifacts. The dashboards for the period are archived under the incident record, and every figure quoted here is taken from the artifacts circulated during the response, so the reader can verify each claim against the same data without access to the live systems.

        **Amplification**

        The client retry trace shows up to 3 attempts per failed request, and the retry-queue metrics show enqueue far above dequeue, so retries multiplied offered load onto a pool that could not grow, extending the brownout. The dashboards for the period are archived under the incident record, and every figure quoted here is taken from the artifacts circulated during the response, so the reader can verify each claim against the same data without access to the live systems.


        ### Evidence appendix: how each memo reads each artifact

        **checkout-gateway access log**

        Memo A: Memo A reads the onset at 14:35 as the moment the re-warming debt crossed the pool capacity, and treats the burst shape as load waves from expiring sessions. It notes the GET endpoints stayed healthy because product reads hit a separate replica.

        Memo B: Memo B reads the onset as deploy plus first traffic peak: the rollout finished at 14:35:20 and the first burst landed at 14:35:41. The burst shape follows concurrency crossing ten, and GET endpoints survived because they rarely touch the orders pool.

        **orders-service error log**

        Memo A: Memo A leans on the cache.client failure lines between 13:50 and 14:10 and argues the database fallback they announce started the extra read load. It treats the later PoolTimeout lines as the symptom of that load.

        Memo B: Memo B notes the fallback lines stop at 14:10 and no cache error appears afterward, while the PoolTimeout lines begin at 14:33 and name pool size 10 - the deployed value, not a load level.

        **postgres slow-query log**

        Memo A: Memo A concedes statement durations stayed flat and attributes this to the 1 ms threshold hiding aggregate pressure, arguing many fast statements can still saturate a pool.

        Memo B: Memo B takes the flat durations at face value: the database served every statement quickly all afternoon, so the wait had to sit in front of the database - in the pool queue.

        **cache fleet metrics**

        Memo A: Memo A accepts that hit rates recovered by 14:10 but argues the damage was already queued: sessions cached during the outage window were lost and would re-warm over the following hour.

        Memo B: Memo B points out hit rates above 0.88 on every node from 14:10 onward, so reads after 14:10 hit the cache and no re-warming wave is visible anywhere in the metrics.

        **connection-pool trace**

        Memo A: Memo A reads size=10 as evidence the pool was overwhelmed and shrank under pressure, a misreading the memo does not defend in detail.

        Memo B: Memo B reads size as the configured maximum: it changed 50 to 10 at 14:32 exactly, one trace tick after the deploy, with waiters and wait_p99_ms following - configuration, not load.

        **deploy history and job log**

        Memo A: Memo A treats the 14:32 deploy as coincidental and notes the post-rollout checks passed, so the deploy looked healthy.

        Memo B: Memo B notes the checks sampled a 60 s window that closed at 14:35:20, 21 seconds before the first burst, so a green gate does not clear the deploy.

        **production config diff**

        Memo A: Memo A does not engage with the diff beyond calling the pool line a tuning change from the capacity review.

        Memo B: Memo B quotes the capacity review sizing guidance (minimum 45) and shows max_connections = 10 contradicts the document the change summary cites.

        **retry-queue metrics**

        Memo A: Memo A reads the queue growth as evidence of database pressure: jobs requeue because the database cannot serve them.

        Memo B: Memo B reads the flat dequeue rate next to PoolTimeout worker results: workers fail on the same starved pool, so the queue measures the pool, not the database.

        **on-call chat export**

        Memo A: Memo A cites the db oncall report of 22 percent cpu as proof the database had headroom the pool failed to use - which the memo turns into an argument that load, not config, pinned the pool.

        Memo B: Memo B cites the same report the other way: the database side saw only 10 connections from orders where 40 is usual, direct evidence of a lowered ceiling.

