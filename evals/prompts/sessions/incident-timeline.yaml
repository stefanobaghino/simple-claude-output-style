    - id: turn-14
      text: |
        Produce the prioritized remediation plan for the checkout outage.
        Below are the candidate backlog items drafted by the responders,
        the production-change standards excerpt that governs ordering, and
        the capacity review excerpt with the pool sizing guidance. Order
        the items per the standards, justify each ranking with the
        incident evidence by artifact name, and reject at least one item
        with reasoning.

        REM-101: Config schema validation for pool bounds
          description: Reject a production config whose database.pool max_connections falls outside a per-service floor and ceiling. The floor for orders-service comes from the capacity review: peak concurrency 18 plus headroom.
          owner: chen
          effort: S

        REM-102: Canary stage watches pool saturation
          description: Extend the deploy pipeline canary to watch pool waiters and wait_p99_ms for ten minutes before full rollout. The 14:32 deploy saturated within three minutes and a canary would have caught it.
          owner: chen
          effort: M

        REM-103: Client retry budget during brownouts
          description: Cap storefront SDK retries with a token bucket per client, so a server brownout does not triple the offered load, as the client retry trace showed.
          owner: ada
          effort: S

        REM-104: Alert on pool waiters
          description: Page when pool waiters exceed zero for three consecutive minutes. The connection-pool trace showed waiters 25 minutes before the responders found the pool.
          owner: dana
          effort: L

        REM-105: Config diffs in deploy notifications
          description: Include the rendered config diff in the deploy channel message, so a reviewer sees a pool change without opening the job log.
          owner: dana
          effort: M

        REM-106: Separate retry queue backpressure
          description: Shed checkout-retry enqueues when depth exceeds a bound, because the retry-queue metrics showed unbounded growth against a fixed dequeue rate.
          owner: dana
          effort: L

        REM-107: Cache-node auto-warm on recovery
          description: Pre-warm a recovered cache node from a snapshot, unrelated to the root cause but flagged during the cache-theory investigation.
          owner: ada
          effort: L

        REM-108: Two-person review for production config
          description: Require a second reviewer on any change touching config/production.toml, since the pool typo shipped inside an unrelated receipts change.
          owner: chen
          effort: L

        REM-109: Longer post-rollout check window
          description: The deploy gate sampled a 60 s window that closed 21 seconds before the first 504 burst, per the deploy history job log. Extend the window to 10 minutes, or gate on trend, not on a single sample.
          owner: ben
          effort: M

        REM-110: Db-side connection floor alert
          description: The database oncall spotted 10 connections from orders-service where 40 is usual, but only when asked. Alert when the connection count from a major client drops far below its baseline, because a shrunken client pool is invisible to the database's own load metrics.
          owner: dana
          effort: M

        REM-111: Config value provenance comments
          description: Require every capacity-derived value in production.toml to carry a comment naming its source document and review date, so a reviewer can spot a value that contradicts its cited source, as max_connections = 10 contradicted the capacity review.
          owner: ben
          effort: M

        REM-112: Incident-doc artifact index automation
          description: The responders assembled the artifact list by hand during the incident. Generate the index from the incident channel automatically, so the review starts from a complete evidence list.
          owner: chen
          effort: M

        REM-113: Brownout load-shed at the gateway
          description: When upstream 504 rates cross a threshold, shed a fraction of retry traffic at the checkout-gateway with a Retry-After header, so client retries do not multiply offered load during a brownout, as the client retry trace documented.
          owner: dana
          effort: L

        REM-114: Pool metrics on the service dashboard
          description: The connection-pool trace existed but sat outside the main orders-service dashboard; the responders found it 35 minutes in. Promote pool size, in_use, and waiters to the front page next to request latency.
          owner: ben
          effort: M

        REM-115: Rollback rehearsal cadence
          description: The rollback took 3 minutes and worked first try, which the review credits to the monthly rehearsal. Keep the cadence and extend the rehearsal to include a config-only rollback.
          owner: chen
          effort: S

        REM-116: Staging config parity check
          description: A responder noted staging worked because staging ran the older build. Add a diff job that reports config drift between staging and production at deploy time, so a config-carried regression is testable before rollout.
          owner: ben
          effort: M

        REM-117: Retry-queue depth ceiling with drop metrics
          description: The checkout-retry queue grew to 5200 jobs with no bound. Cap the depth, drop oldest-first beyond the cap, and count drops, because an unbounded retry queue turns a brownout into a backlog that outlives it.
          owner: ben
          effort: M

        REM-118: Session TTL review
          description: The cache-theory memo leaned on the 3600 s session TTL for its re-warming mechanism. The TTL is unrelated to this incident, but the review found no owner and no rationale for the value; assign an owner and document it.
          owner: chen
          effort: L

        REM-119: Support-status page latency
          description: Support fielded several hundred tickets before the status page acknowledged degraded checkout at 14:52, 17 minutes after onset. Set a 10-minute acknowledgment target for severity 1 with customer impact.
          owner: ben
          effort: S

        REM-120: Error-budget policy hook
          description: The burn rate hit 14x during the incident. Wire the burn-rate alert to the deploy pipeline so a burning budget freezes non-emergency deploys automatically until the incident closes.
          owner: dana
          effort: L

        ## Excerpt: production-change standards (v7)  A remediation plan orders its items by risk reduction per unit effort, not by ease. Each item names the incident evidence that motivates it. An item that would have prevented the incident outright outranks an item that would have shortened it; an item that shortens detection outranks an item that documents. A plan proposes at most two process items, because process items decay; prefer controls that machines enforce. Every accepted item gets an owner and a quarter; an unowned item is a wish, not a remediation. The plan states, for each rejected candidate item, one sentence of reasoning, so the review shows its negative space as well as its choices. Standards history: v6 added the machine-enforced-control preference after the 2025-06-11 payments incident, where a deferred volume separation returned as a root cause; v5 added the owner requirement; v4 introduced risk-per-effort ordering.

        ## Capacity review excerpt (2025-10, orders-service)

        Peak measured database concurrency: 18 connections at the
        November promotional peak forecast. Pool sizing guidance: peak
        concurrency times 2.5 headroom, minimum 45, reviewed quarterly.
        The review also recorded: acquire timeout 5000 ms is the last
        defense, not a sizing tool; a pool that relies on its timeout is
        undersized by definition. Statement latency budget: p99 under
        80 ms on the orders primary; the slow-query threshold stays at
        1 ms so the log carries every statement for incident forensics.

        ## Attached: the evidence the rankings cite

