# One coherent deep drift session. Contract:
#
# - `session.id` names the script, and the file name matches
#   "<id>.yaml".
# - `turns` is the ordered turn list. Every turn has a unique id and
#   a self-contained text: an answer needs no tools and no
#   repository.
# - Every script in prompts/sessions/ has the same turn count,
#   because the drift analysis pools by turn position across
#   sessions.
# - Later turns reference material from earlier turns by artifact
#   name, so the model must read deep context.
# - Changes to this file change the measurement. The provenance of a
#   deep run records the sha256 of every script file.

