        ## Second worked example (search-indexer, 2025-03-08)

        **Root cause**

        The March search outage was triggered by an index schema rollout that renamed a field consumed by the query planner. The planner fell back to a full scan per query, and query cost rose by two orders of magnitude. The amplifier was the search frontend's cache: scan results exceeded the cache entry size limit, so every query missed and hit the planner again. The review cited the rollout manifest, the planner explain-plans captured during the incident, and the cache hit-rate graph, each by name.

        **Trigger versus vulnerability**

        The trigger was the rename. The vulnerability was a planner that degrades to a scan silently instead of failing loudly on an unknown field, plus a schema pipeline with no consumer contract check. Both named, both with owners in the remediation plan.

        **Detection**

        Query latency alerts paged within four minutes of the rollout. The review still faulted detection: the rollout gate watched indexing throughput, not query latency, so the gate passed a change whose damage sat entirely on the read path. The parallel to watch: a gate that samples the wrong window or the wrong signal clears a harmful deploy - compare the 60 s post-rollout check window in the checkout incident's deploy history.

        **Resolution**

        Rollback of the schema rollout; recovery within two minutes of the planner seeing the old field name. The review noted rollback was chosen over a forward fix for the same reason as in the checkout incident: the fastest safe move under customer impact.

        **Impact**

        Search p99 above 8 s for 31 minutes; roughly 60 percent of searches timed out client-side; no data loss. Revenue effect bounded by the search-to-purchase attach rate and stated as a range, per the communication guidelines.

        ### Common failure modes of root-cause sections (review-board list)

        - Naming a component instead of a change: 'the pool was too
          small' hides who made it small, when, and why.
        - Mechanism gaps: the section jumps from change to impact without
          the middle (here: config change -> pool ceiling -> waiters ->
          acquire timeout -> 504).
        - Blaming the amplifier: retries worsened the checkout outage but
          did not cause it; a section that leads with retries misassigns
          the fix.
        - Adopting the first plausible theory: the cache-node theory held
          the room for 30 minutes against two artifacts that refuted it.
        - Citing dashboards instead of artifacts: a claim tied to 'the
          graphs' cannot be re-verified; a claim tied to a named log can.
        - Speculative language: 'likely', 'probably', and 'may have'
          signal an unfinished investigation, not a humble one.
        - Undated statements: every claim in the section carries a
          timestamp or a window, or it cannot anchor the timeline.
        - Hidden vulnerabilities: a trigger-only section produces a
          remediation plan that prevents one typo instead of a class.

