    - id: turn-15
      text: |
        Write the executive postmortem summary for the checkout outage,
        following the communication guidelines excerpt below. The email
        thread shows what stakeholders already heard, so stay consistent
        with the numbers given to legal and to the VP: the impact window,
        the error fraction, and the no-double-charge statement. The root
        cause in plain words must match your root-cause section from the
        incident review: the configuration mistake, not the cache-node
        failure.

        From: vp.commerce@shop.example.com
        To: incident-response@shop.example.com
        Subject: Checkout failures - what do I tell the leadership call at 9?

        I need three sentences I can say out loud: what broke, who was affected, and whether it can happen again tomorrow. The support queue shows several hundred tickets. Please keep the database vocabulary out of it.
        ------------------------------------------------------------
        From: ada.kim@shop.example.com
        To: vp.commerce@shop.example.com
        Subject: Re: Checkout failures

        Working on it. Short version: a configuration mistake in yesterday's release limited how many simultaneous orders we could process; roughly 4 in 10 checkout attempts failed between 14:35 and 15:27 UTC; we rolled the release back and are adding checks so this class of mistake cannot ship again.
        ------------------------------------------------------------
        From: support-lead@shop.example.com
        To: incident-response@shop.example.com
        Subject: Customer messaging

        We are telling affected customers their payment was not taken twice. Can engineering confirm no double charges? Some retried checkouts show duplicate order confirmations in the app.
        ------------------------------------------------------------
        From: ben.ortiz@shop.example.com
        To: support-lead@shop.example.com
        Subject: Re: Customer messaging

        Confirmed no double charges: payment capture is idempotent per cart. The duplicate confirmations came from client retries racing a slow success; the orders deduplicate on cart id, and the app shows both events. Cosmetic, fix tracked.
        ------------------------------------------------------------
        From: legal@shop.example.com
        To: incident-response@shop.example.com
        Subject: SLA exposure

        Two enterprise storefront tenants have a 99.9 monthly SLA on checkout availability. Please state the measured availability impact window and error rate for the affected endpoints only, so we can compute credits.
        ------------------------------------------------------------
        From: dana.reyes@shop.example.com
        To: legal@shop.example.com
        Subject: Re: SLA exposure

        Impact window 14:35-15:27 UTC (52 minutes). POST /api/v1/checkout and POST /api/v1/cart/confirm returned 504 for about 42 percent of attempts in bursts; GET endpoints were unaffected. Numbers from the checkout-gateway access log; the raw log is in the incident record.
        ------------------------------------------------------------
        From: finance-ops@shop.example.com
        To: incident-response@shop.example.com
        Subject: Revenue impact estimate needed by Thursday

        For the monthly close we need a bounded estimate of orders lost versus orders delayed. If 42 percent of checkout attempts failed for 52 minutes, how many completed on retry within the hour? Marketing also asks whether the promotional cohort was affected differently; they were mid-campaign.
        ------------------------------------------------------------
        From: ada.kim@shop.example.com
        To: finance-ops@shop.example.com
        Subject: Re: Revenue impact estimate

        From the client retry trace and the order table: most failed attempts retried automatically, and roughly half of the affected carts completed within the impact hour. The rest abandoned or completed later; the order data team will bound it properly. The promotional cohort saw the same failure rate - the failure did not discriminate by traffic source.
        ------------------------------------------------------------
        From: pr-team@shop.example.com
        To: incident-response@shop.example.com
        Subject: Press statement draft - please fact check

        Draft: 'A brief technical issue affected some checkouts on Tuesday afternoon. The issue was identified and resolved within minutes.' Flagging that a journalist already asked; please confirm the wording is accurate before we send.
        ------------------------------------------------------------
        From: dana.reyes@shop.example.com
        To: pr-team@shop.example.com
        Subject: Re: Press statement draft

        Two corrections. 'Within minutes' is wrong: impact lasted 52 minutes, detection to resolution. 'Some checkouts' undersells it: roughly 4 in 10 attempts during the window. Suggest: 'a configuration error in a Tuesday release degraded checkout for 52 minutes; about 40 percent of attempts during that window failed and most completed on retry; the release was rolled back and safeguards are being added.'
        ------------------------------------------------------------
        From: eng-director@shop.example.com
        To: ada.kim@shop.example.com
        Subject: Review scheduling and scope

        Set the review for Friday. Scope note: I want the review to cover why the cache theory held the room for half an hour - not to assign blame, but because theory selection cost us more minutes than the rollback did. Also confirm the summary will follow the five-sentence guideline; the last one ran a page and nobody read the cause.
        ------------------------------------------------------------
        From: ada.kim@shop.example.com
        To: eng-director@shop.example.com
        Subject: Re: Review scheduling and scope

        Friday works. On theory selection: the chat export shows the cache theory arrived first because the cache-3 outage was the most recent memorable event, and it survived until the pool trace and the config diff refuted it at 15:07 and 15:14. The review will state that plainly. Summary will be five sentences, numbers as ranges, no component names beyond 'a configuration error in a release'.
        ------------------------------------------------------------
        From: vp.commerce@shop.example.com
        To: ada.kim@shop.example.com
        Subject: Re: Re: Checkout failures

        Your three sentences worked in the leadership call. For the board packet I need the final version by Friday evening: the same content, plus the recurrence-prevention sentence. Keep it self-contained; board members will not click a link.
        ------------------------------------------------------------
        From: support-lead@shop.example.com
        To: incident-response@shop.example.com
        Subject: Ticket tail

        Ticket volume returned to baseline by 16:30. 412 incident tickets total, 391 resolved with the standard macro, 21 escalated for duplicate-confirmation confusion - matches the cosmetic issue Ben described. Nothing suggesting double charges, consistent with engineering's statement.
        ------------------------------------------------------------

        ## Excerpt: incident communication guidelines

        An executive summary of an incident is five sentences: what the customer experienced, the size of the impact, the root cause in plain words, what ended it, and what prevents recurrence. It names no internal component unless the name carries meaning for the reader. It states numbers as ranges a non-engineer can check: a fraction of attempts, a window in minutes. It never assigns individual blame, because a person who fears the summary hides the next incident. It links the full review for readers who want the mechanism. The summary is written after the root-cause section is agreed, never before, so the plain-words cause cannot drift from the technical one. Guideline history: the five-sentence form replaced a one-page form in 2024 after readers reported skimming past the cause; the no-blame rule predates the guidelines and comes from the review culture document; the numbers-as-ranges rule was added when a summary quoted a p99 latency to a reader who took it for an average.

        ### Worked contrast: two summaries of the same June incident

        The rejected draft: 'On June 11 the payments-service write-ahead queue on payments-3 experienced persistence failures due to volume saturation caused by uncompressed log archives following a permissions regression in the base image, leading to authorization unavailability until archive truncation restored headroom.' One sentence, six internal nouns, no customer, no numbers, no prevention - it fails every guideline at once.

        The accepted summary: 'For 23 minutes on June 11, customers could not complete new payments; existing orders were unaffected. All payment attempts in that window failed, and about half completed automatically within the hour. A maintenance job stopped cleaning up old files, and the disk that filled up was shared with the component that records payments. The on-call engineer freed the disk, which restored payments within two minutes. Separating that storage and rerouting the early warning alerts prevents a recurrence, and the full review links the details.' Five sentences, one plain mechanism, ranges a non-engineer can check, prevention stated, review linked.

        ### Attached: the reviewed evidence behind the numbers

        The figures quoted to stakeholders trace to these segments; the
        summary must not contradict them.

