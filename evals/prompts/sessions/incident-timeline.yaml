      text: |
        Write the root-cause section of the incident review for the
        checkout outage, following the platform template below. Two worked
        examples from prior incidents show the expected depth, and the
        review-board list shows the failure modes to avoid. Your root
        cause must name the triggering change from the production config
        diff, the mechanism through the connection-pool trace, the
        amplifier from the client retry trace, and why the draft memo
        blaming the cache-node failure does not fit the cache fleet
        metrics.

        ## Incident review template (platform standard)

        1. Root cause: one paragraph. Name the triggering change, the
           mechanism, and the amplifiers. No speculation: every sentence
           cites an artifact.
        2. Trigger versus vulnerability: separate what changed from what
           made the system fragile to that change.
        3. Detection: what alerted, when, and what a faster detection
           would have needed.
        4. Resolution: the action that ended the impact and why it worked.
        5. Impact: affected endpoints, error rates, duration, customer
           effect.

        ## Worked example from a prior incident (payments-service, 2025-06-11)

        **Root cause**

        The 2025-06-11 payments outage was triggered by a log-rotation job that stopped compressing archives after a permissions change, filling the data volume of the payments-service hosts. When the volume reached 100 percent, the local write-ahead queue could not persist authorization records, and the service refused new authorizations by design. The full evidence bundle for that incident, including the disk trend graphs, the alert routing history, and the volume layout review, is archived with the June incident record; the excerpt here quotes only what the template sections need, so the shape of a compliant review is visible without the whole bundle.

        **Trigger versus vulnerability**

        The trigger was the permissions change in the June 10 base image. The vulnerability was a data volume shared between logs and the write-ahead queue, so a logging fault could starve a payment-critical writer. The separation had been proposed in the Q1 capacity review and deferred. The full evidence bundle for that incident, including the disk trend graphs, the alert routing history, and the volume layout review, is archived with the June incident record; the excerpt here quotes only what the template sections need, so the shape of a compliant review is visible without the whole bundle.

        **Detection**

        Disk alerts fired at 85 percent, 40 minutes before impact, but the alert routed to a low-urgency channel because disk alerts had a history of false positives. Impact-based alerts fired only when authorizations failed. The full evidence bundle for that incident, including the disk trend graphs, the alert routing history, and the volume layout review, is archived with the June incident record; the excerpt here quotes only what the template sections need, so the shape of a compliant review is visible without the whole bundle.

        **Resolution**

        The on-call engineer truncated the archived logs, restoring 31 percent free space, and authorizations resumed within two minutes as the write-ahead queue drained. The full evidence bundle for that incident, including the disk trend graphs, the alert routing history, and the volume layout review, is archived with the June incident record; the excerpt here quotes only what the template sections need, so the shape of a compliant review is visible without the whole bundle.

        **Impact**

        Authorization requests failed for 23 minutes, a 100 percent error rate on new payments during the window. Retries by upstream checkout flows recovered roughly half of the affected purchases within the hour. The full evidence bundle for that incident, including the disk trend graphs, the alert routing history, and the volume layout review, is archived with the June incident record; the excerpt here quotes only what the template sections need, so the shape of a compliant review is visible without the whole bundle.

