        ```python
        """Config loader: one frozen Config object per process.

        Precedence: environment variables over the config file over the
        bootstrap defaults below. current_config() returns the last loaded
        object; load() replaces it.
        """

        from __future__ import annotations

        import os
        import tomllib
        from dataclasses import dataclass, field
        from pathlib import Path


        @dataclass(frozen=True)
        class TokenEntry:
            token_sha256: str
            team: str
            role: str


        @dataclass(frozen=True)
        class Config:
            dsn: str = "postgresql://cronwell@localhost/cronwell"
            pool_size: int = 10
            api_bind: str = "0.0.0.0:8180"
            api_tokens: tuple = ()
            admin_networks: tuple = ()
            dispatcher_tick_s: float = 5.0
            lease_batch: int = 16
            reaper_grace_s: int = 120
            retry_max_attempts: int = 5
            retry_backoff_base_ms: int = 200
            retry_backoff_cap_ms: int = 60000
            default_priority: int = 5
            default_jitter_s: int = 30
            quota_runs_per_hour: int = 1200
            metrics_host: str = "statsd.internal"
            metrics_port: int = 8125
            metrics_prefix: str = "cronwell"
            log_level: str = "info"
            log_sample_rate: float = 1.0
            payload_max_bytes: int = 65536
            namespace_default_retention_days: int = 30
            heartbeat_interval_s: int = 15
            shutdown_grace_s: int = 30


        _current = Config()


        def current_config() -> Config:
            return _current


        def load(path: str | os.PathLike | None = None) -> Config:
            """Load the config file and apply environment overrides."""
            global _current
            values: dict = {}
            if path is not None and Path(path).exists():
                with open(path, "rb") as handle:
                    raw = tomllib.load(handle)
                values.update(_flatten(raw))
            values.update(_environment_overrides())
            tokens = tuple(TokenEntry(**entry) for entry in values.pop("api_tokens", []))
            _current = Config(api_tokens=tokens, **values)
            return _current


        def _flatten(raw: dict) -> dict:
            known = {name for name in Config.__dataclass_fields__}
            flat = {}
            for section, body in raw.items():
                if isinstance(body, dict):
                    for key, value in body.items():
                        name = f"{section}_{key}" if f"{section}_{key}" in known else key
                        if name in known:
                            flat[name] = value
                elif section in known:
                    flat[section] = body
            return flat


        def _environment_overrides() -> dict:
            overrides = {}
            for name, spec in Config.__dataclass_fields__.items():
                env_name = "CRONWELL_" + name.upper()
                if env_name not in os.environ:
                    continue
                raw_value = os.environ[env_name]
                target = spec.type
                if target == "int":
                    overrides[name] = int(raw_value)
                elif target == "float":
                    overrides[name] = float(raw_value)
                elif target == "tuple":
                    overrides[name] = tuple(raw_value.split(","))
                else:
                    overrides[name] = raw_value
            return overrides


        def dump_effective(config: Config) -> str:
            """The effective config as TOML-ish text for the /configz page,
            with token digests truncated and no secrets expanded.
            """
            lines = []
            for name in sorted(Config.__dataclass_fields__):
                value = getattr(config, name)
                if name == "api_tokens":
                    value = f"<{len(value)} tokens>"
                lines.append(f"{name} = {value!r}")
            return "\n".join(lines)
