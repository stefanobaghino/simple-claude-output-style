        ## Error taxonomy draft (from the service handbook, unfinished)

        The handbook prescribes three strategies and asks every module
        to declare one. Raise-through: domain exceptions cross the
        boundary and the caller maps them (prescribed for models and
        config). Result-value: the callee returns None/False for the
        expected failure and raises only for bugs (prescribed for
        storage reads). Absorb-and-count: the callee swallows, emits a
        metric, and the caller cannot observe the failure (permitted
        only for metrics itself). The draft never assigned a strategy
        to storage WRITES, and the modules diverged: insert/update
        absorb IntegrityError into the result-value channel, where the
        read path uses None for 'absent', so one value means two things
        by the time the API layer translates it. The taxonomy also
        notes: an absorbed error that crosses a process boundary (the
        404 to a client, the silent skip in a run history) is the only
        class that produces support tickets instead of pages, because
        no internal signal fires at all. The audit closes by listing
        where each strategy is load-bearing: the consumer boundary
        must catch everything or one bad handler kills the loop; the
        dispatcher tick must survive any single tick failure; the API
        must never leak a stack trace to a client.


