        ## Postmortem excerpt: the March retry storm

        On March 14 the metrics host lost DNS for 40 minutes. Handler
        durations ballooned because every emit blocked on resolution
        inside the metrics lock, handlers crossed their registration
        timeouts, attempts failed in bulk, and the retry policy did what
        it promises: it returned every failed run to the pending set
        with backoff. The pending set grew from 300 to 68k runs. When
        DNS returned, the lease query delivered the backlog strictly by
        scheduled_for, so the oldest retries landed first and the fleet
        spent 2.1 hours draining history before current work ran again.

        Two follow-ups were filed and remain open. First, the backoff
        ladder caps at 60 s for most namespaces, so 68k runs re-arrived
        in near-synchronized waves; the ticket proposes per-namespace
        cap review (the policy table above is its inventory). Second,
        the postmortem could not answer whether redelivered runs were
        double-executed at the handlers' external systems, because
        delivery semantics differ between what the consumer implements
        and what this module assumes; the ticket quotes both docstrings
        and stalled without a decision. The billing team reported 41
        duplicate ledger entries that week and reconciled them by hand;
        their handler declares idempotent = false in the registration
        catalog, which nothing enforces.


