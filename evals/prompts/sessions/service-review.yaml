          40
          41      def _loop(self) -> None:
          42          while not self._stop.wait(self._tick_s):
          43              with self._lock:
          44                  try:
          45                      self._materialize_due()
          46                      self._balance_capacity()
          47                  except Exception:  # noqa: BLE001 - the loop must survive a tick
          48                      metrics.count("dispatcher.tick_error")
          49
          50      def _materialize_due(self) -> None:
          51          """Create pending runs for every schedule whose time arrived."""
          52          now = datetime.now(timezone.utc)
          53          horizon = now + timedelta(seconds=self._tick_s * 2)
          54          for schedule in self._schedules.list():
          55              fire_at = next_run_at_from_row(schedule)
          56              if fire_at > horizon:
          57                  continue
          58              existing = self._runs.list(
          59                  job_id=schedule["job_id"], scheduled_for=fire_at,
          60              )
          61              if existing:
          62                  continue  # already materialized by an earlier tick
          63              run = JobRun(
          64                  id=None, job_id=schedule["job_id"], scheduled_for=fire_at,
          65                  state=RunState.PENDING.value,
          66              )
          67              run.validate()
          68              self._runs.insert(run.to_row())
          69              metrics.count("dispatcher.materialized")
          70
          71      def _balance_capacity(self) -> None:
          72          """Refuse new materialization when the fleet is saturated.
          73
          74          Capacity is the sum of worker capacities minus leased and
          75          running runs. The check reads the counts, then later ticks
          76          insert; a burst between read and insert can overshoot, which
          77          the fleet absorbs through the lease limit.
          78          """
          79          workers = self._workers.list(draining=False)
          80          capacity = sum(w["capacity"] for w in workers)
          81          active = len(self._runs.list(state=RunState.LEASED.value)) + len(
          82              self._runs.list(state=RunState.RUNNING.value)
          83          )
          84          if active >= capacity:
          85              metrics.gauge("dispatcher.saturation", active - capacity)
          86              self._stop.wait(self._tick_s)
          87
          88      def enqueue_manual(self, job_id: int) -> dict | None:
          89          """A user-requested immediate run (the API calls this)."""
          90          with self._lock:
          91              run = JobRun(
          92                  id=None, job_id=job_id,
          93                  scheduled_for=datetime.now(timezone.utc),
          94                  state=RunState.PENDING.value,
          95              )
          96              run.validate()
          97              inserted = self._runs.insert(run.to_row())
          98              if inserted:
          99                  metrics.count("dispatcher.manual_enqueue")

