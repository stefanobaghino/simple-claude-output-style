        def next_run_at(schedule: Schedule, after: datetime | None = None) -> datetime:
            """The next fire time of a schedule, in UTC.

            Cron evaluation is minute-granular; jitter is added by the
            dispatcher, not here, so the value is stable for dedup.
            """
            # Anchor on the current wall clock when no lower bound is given.
            anchor = after or datetime.utcnow()
            minute = anchor.replace(second=0, microsecond=0)
            for _ in range(366 * 24 * 60):
                minute = minute + timedelta(minutes=1)
                if _cron_matches(schedule.cron_expr, minute):
                    return minute
            raise ValidationError(f"cron never fires: {schedule.cron_expr}")


        def _cron_matches(expr: str, moment: datetime) -> bool:
            fields = expr.split()
            if len(fields) != 5:
                raise ValidationError(f"cron needs 5 fields: {expr!r}")
            minute, hour, dom, month, dow = fields
            return (
                _field_matches(minute, moment.minute, 0, 59)
                and _field_matches(hour, moment.hour, 0, 23)
                and _field_matches(dom, moment.day, 1, 31)
                and _field_matches(month, moment.month, 1, 12)
                and _field_matches(dow, moment.weekday(), 0, 6)
            )


        def _field_matches(spec: str, value: int, lo: int, hi: int) -> bool:
            if spec == "*":
                return True
            for part in spec.split(","):
                if part.startswith("*/"):
                    step = int(part[2:])
                    if step <= 0:
                        raise ValidationError(f"cron step must be positive: {spec!r}")
                    if (value - lo) % step == 0:
                        return True
                elif "-" in part:
                    a, b = part.split("-", 1)
                    if int(a) <= value <= int(b):
                        return True
                elif int(part) == value:
                    return True
            return False
