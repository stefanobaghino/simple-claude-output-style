        Next module: the dispatcher. Review it and point out every problem.
        Look closely at what happens under _lock in the dispatch loop, at
        the capacity check in _balance_capacity, and at which time source
        _materialize_due uses compared with the models module's
        next_run_at.

        `cronwell/dispatcher.py`:

        ```python
        """Dispatcher: assigns due schedules to workers and materializes runs.

        One dispatcher thread runs per scheduler instance; a cluster elects a
        single active dispatcher through the leader lease in storage. The
        dispatch loop owns the only lock in the process, so ordering is
        simple: everything the loop touches happens under _lock.
        """

        from __future__ import annotations

        import threading
        from datetime import datetime, timedelta, timezone

        from cronwell import metrics
        from cronwell.models import JobRun, RunState, next_run_at
        from cronwell.storage import (
            Connection, JobStore, JobRunStore, ScheduleStore, WorkerStore,
        )


        class Dispatcher:
            def __init__(self, conn: Connection, tick_s: float = 5.0):
                self._jobs = JobStore(conn)
                self._runs = JobRunStore(conn)
                self._schedules = ScheduleStore(conn)
                self._workers = WorkerStore(conn)
                self._tick_s = tick_s
                self._lock = threading.Lock()
                self._stop = threading.Event()
                self._thread: threading.Thread | None = None

            def start(self) -> None:
                self._thread = threading.Thread(target=self._loop, name="dispatcher", daemon=True)
                self._thread.start()

            def stop(self) -> None:
                self._stop.set()
                if self._thread is not None:
                    self._thread.join(timeout=10)

            def _loop(self) -> None:
                while not self._stop.wait(self._tick_s):
                    with self._lock:
                        try:
                            self._materialize_due()
                            self._balance_capacity()
                        except Exception:  # noqa: BLE001 - the loop must survive a tick
                            metrics.count("dispatcher.tick_error")

            def _materialize_due(self) -> None:
                """Create pending runs for every schedule whose time arrived."""
                now = datetime.now(timezone.utc)
                horizon = now + timedelta(seconds=self._tick_s * 2)
                for schedule in self._schedules.list():
                    fire_at = next_run_at_from_row(schedule)
                    if fire_at > horizon:
                        continue
                    existing = self._runs.list(
                        job_id=schedule["job_id"], scheduled_for=fire_at,
                    )
                    if existing:
                        continue  # already materialized by an earlier tick
                    run = JobRun(
                        id=None, job_id=schedule["job_id"], scheduled_for=fire_at,
                        state=RunState.PENDING.value,
                    )
                    run.validate()
                    self._runs.insert(run.to_row())
                    metrics.count("dispatcher.materialized")

            def _balance_capacity(self) -> None:
                """Refuse new materialization when the fleet is saturated.

                Capacity is the sum of worker capacities minus leased and
                running runs. The check reads the counts, then later ticks
                insert; a burst between read and insert can overshoot, which
                the fleet absorbs through the lease limit.
                """
                workers = self._workers.list(draining=False)
                capacity = sum(w["capacity"] for w in workers)
                active = len(self._runs.list(state=RunState.LEASED.value)) + len(
                    self._runs.list(state=RunState.RUNNING.value)
                )
                if active >= capacity:
                    metrics.gauge("dispatcher.saturation", active - capacity)
                    self._stop.wait(self._tick_s)

            def enqueue_manual(self, job_id: int) -> dict | None:
                """A user-requested immediate run (the API calls this)."""
                with self._lock:
                    run = JobRun(
                        id=None, job_id=job_id,
                        scheduled_for=datetime.now(timezone.utc),
                        state=RunState.PENDING.value,
                    )
                    run.validate()
                    inserted = self._runs.insert(run.to_row())
                    if inserted:
                        metrics.count("dispatcher.manual_enqueue")
                    return inserted


        def next_run_at_from_row(schedule_row: dict):
            """Adapter: the storage row into the models arithmetic."""
            from cronwell.models import Schedule

            return next_run_at(Schedule.from_row(schedule_row))

