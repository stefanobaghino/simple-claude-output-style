        """The cronwell test suite (excerpt shipped for review).

        Conventions: storage is mocked with MemoryStore, time is frozen
        with freeze_time, and every test is single-threaded.
        """

        from __future__ import annotations

        from datetime import datetime
        from unittest import mock

        import pytest

        from cronwell.models import (
            Job,
            Schedule,
            JobRun,
            RunAttempt,
            Worker,
            Namespace,
            JobDependency,
            QuotaUsage,
            AuditEvent,
            HandlerRegistration,
            RunState,
            ValidationError,
            next_run_at,
        )


        class MemoryStore:
            """A dict-backed stand-in for any storage class."""

            def __init__(self):
                self.rows = {}
                self.next_id = 1

            def insert(self, row):
                row = {**row, 'id': self.next_id}
                self.rows[self.next_id] = row
                self.next_id += 1
                return row

            def get(self, entity_id):
                return self.rows.get(entity_id)

            def list(self, **filters):
                found = []
                for row in self.rows.values():
                    if all(row.get(k) == v for k, v in filters.items()):
                        found.append(row)
                return found

            def update(self, entity_id, changes):
                if entity_id not in self.rows:
                    return None
                self.rows[entity_id].update(changes)
                return self.rows[entity_id]

            def delete(self, entity_id):
                return self.rows.pop(entity_id, None) is not None


        def freeze_time(monkeypatch, at: str):
            """Freeze models.datetime.utcnow at a naive instant."""
            frozen = datetime.fromisoformat(at)

            class FrozenDatetime(datetime):
                @classmethod
                def utcnow(cls):
                    return frozen

            monkeypatch.setattr("cronwell.models.datetime", FrozenDatetime)
            return frozen


