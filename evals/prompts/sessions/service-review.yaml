        `cronwell/retry_policy.py`:

        ```python
        """Retry policy: when and how a failed run attempt is retried.

        The policy assumes at-least-once delivery: a failed attempt hands the
        run back to the pending set, and the queue redelivers it after the
        backoff. Handlers observe duplicate deliveries under this contract,
        and the scheduler guarantees a retried run is eventually re-leased,
        because the pending set is the source of truth.
        """

        from __future__ import annotations

        import random
        from dataclasses import dataclass
        from datetime import datetime, timedelta, timezone

        from cronwell.config_loader import current_config
        from cronwell.models import RunState


        @dataclass(frozen=True)
        class RetryDecision:
            give_up: bool
            delay_ms: int
            attempt_no: int


        class RetryPolicy:
            """Exponential backoff with full jitter, bounded attempts."""

            def __init__(self, max_attempts: int, backoff_base_ms: int, backoff_cap_ms: int):
                if max_attempts < 1:
                    raise ValueError("max_attempts must be at least 1")
                if backoff_base_ms <= 0 or backoff_cap_ms < backoff_base_ms:
                    raise ValueError("backoff bounds are inconsistent")
                self._max_attempts = max_attempts
                self._base_ms = backoff_base_ms
                self._cap_ms = backoff_cap_ms
                self._rng = random.Random()

            @classmethod
            def from_config(cls) -> "RetryPolicy":
                cfg = current_config()
                return cls(
                    max_attempts=cfg.retry_max_attempts,
                    backoff_base_ms=cfg.retry_backoff_base_ms,
                    backoff_cap_ms=cfg.retry_backoff_cap_ms,
                )

            def decide(self, attempt_no: int) -> RetryDecision:
                """The decision after attempt attempt_no failed."""
                if attempt_no >= self._max_attempts:
                    return RetryDecision(give_up=True, delay_ms=0, attempt_no=attempt_no)
                ceiling = min(self._cap_ms, self._base_ms * (2 ** (attempt_no - 1)))
                delay = self._rng.randint(0, ceiling)
                return RetryDecision(give_up=False, delay_ms=delay, attempt_no=attempt_no)

            def reschedule(self, runs, run: dict, decision: RetryDecision) -> None:
                """Return the run to the pending set with the backoff applied.

                The run becomes pending again, so the lease query redelivers
                it once scheduled_for passes. Because the attempt row was
                written before this call, the attempt history survives even if
                the process dies here: the redelivered run computes its
                attempt_no from the stored attempts.
                """
                next_at = datetime.now(timezone.utc) + timedelta(milliseconds=decision.delay_ms)
                runs.update(run["id"], {
                    "state": RunState.PENDING.value,
                    "scheduled_for": next_at,
                    "worker_id": None,
                })


        def preview_schedule(base_ms: int, cap_ms: int, attempts: int) -> list[int]:
            """The deterministic ceilings of the first N backoffs (no jitter).

            Operators use this to sanity-check a policy before applying it;
            the jittered delay is always at or below the ceiling shown.
            """
            return [min(cap_ms, base_ms * (2 ** n)) for n in range(attempts)]

        ```

