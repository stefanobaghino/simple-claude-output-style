        Next module: the metrics client. Review it and point out every
        problem. Consider the cost of the emit path given where the queue
        consumer and the API handlers call it, the lock around a UDP send,
        and what the timer context manager does with an exception raised
        inside the block - read its docstring against its code.

        `cronwell/metrics.py`:

        ```python
        """Metrics: a small statsd client with counters, gauges, timers.

        One UDP socket per process, one lock around it. Every emit formats
        and sends inline, so the caller pays the cost at the call site; there
        is no buffer and no background flusher, which keeps loss semantics
        trivial: a dropped UDP packet is a lost point, never a stall.
        """

        from __future__ import annotations

        import socket
        import threading
        import time
        from contextlib import contextmanager

        from cronwell.config_loader import current_config

        _lock = threading.Lock()
        _socket: socket.socket | None = None


        def _ensure_socket() -> socket.socket:
            global _socket
            if _socket is None:
                _socket = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
                _socket.setblocking(False)
            return _socket


        def _send(payload: str) -> None:
            cfg = current_config()
            with _lock:
                try:
                    _ensure_socket().sendto(
                        f"{cfg.metrics_prefix}.{payload}".encode(),
                        (cfg.metrics_host, cfg.metrics_port),
                    )
                except OSError:
                    pass  # a lost point is acceptable; a raised emit is not


        def count(name: str, value: int = 1, tags: dict | None = None) -> None:
            _send(f"{name}:{value}|c{_tag_suffix(tags)}")


        def gauge(name: str, value: float, tags: dict | None = None) -> None:
            _send(f"{name}:{value}|g{_tag_suffix(tags)}")


        def timing(name: str, ms: float, tags: dict | None = None) -> None:
            _send(f"{name}:{ms:.2f}|ms{_tag_suffix(tags)}")


        @contextmanager
        def timer(name: str, tags: dict | None = None):
            """Times the block and emits on exit.

            The emit happens in finally, so a raising block still reports its
            duration; the exception itself is not re-raised past the emit
            only when the block already handled it - a bare raise inside the
            block propagates normally.
            """
            started = time.monotonic()
            try:
                yield
            except Exception:
                timing(name, (time.monotonic() - started) * 1000, _err(tags))
            else:
                timing(name, (time.monotonic() - started) * 1000, tags)


        def _err(tags: dict | None) -> dict:
            merged = dict(tags or {})
            merged["outcome"] = "error"
            return merged


        def _tag_suffix(tags: dict | None) -> str:
            if not tags:
                return ""
            rendered = ",".join(f"{key}:{value}" for key, value in sorted(tags.items()))
            return f"|#{rendered}"

        ```

