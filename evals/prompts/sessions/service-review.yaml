                sql += " ORDER BY id"
                return self._conn.execute(sql, tuple(params))

            def update(self, entity_id: int, changes: dict) -> dict | None:
                if not changes:
                    return self.get(entity_id)
                sets = ", ".join(f"{key} = %s" for key in sorted(changes))
                try:
                    rows = self._conn.execute(
                        f"UPDATE handler_registrations SET {sets} WHERE id = %s "
                        f"RETURNING id, path, owner_team, timeout_s, idempotent",
                        tuple(changes[key] for key in sorted(changes)) + (entity_id,),
                    )
                except IntegrityError:
                    return None
                return rows[0] if rows else None

            def delete(self, entity_id: int) -> bool:
                rows = self._conn.execute(
                    "DELETE FROM handler_registrations WHERE id = %s RETURNING id", (entity_id,)
                )
                return bool(rows)


        class LeaseStore:
            """Run leasing: the queue consumer takes work through here."""

            def __init__(self, conn: Connection):
                self._conn = conn

            def lease_due_runs(self, worker_id: str, limit: int) -> list[dict]:
                """Atomically lease up to limit due runs for a worker.

                The scheduled_for comparison happens in the database
                against now(), so every comparison is aware-vs-aware.
                """
                return self._conn.execute(
                    "UPDATE job_runs SET state = 'leased', worker_id = %s "
                    "WHERE id IN (SELECT id FROM job_runs "
                    "WHERE state = 'pending' AND scheduled_for <= now() "
                    "ORDER BY scheduled_for LIMIT %s FOR UPDATE SKIP LOCKED) "
                    "RETURNING id, job_id, scheduled_for",
                    (worker_id, limit),
                )

            def record_heartbeat(self, worker_id: str, at: datetime) -> None:
                if at.tzinfo is None:
                    raise StorageError("heartbeat timestamps must be timezone-aware")
                self._conn.execute(
                    "UPDATE workers SET last_heartbeat_at = %s WHERE hostname = %s",
                    (at, worker_id),
                )
