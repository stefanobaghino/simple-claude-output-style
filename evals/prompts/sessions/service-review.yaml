                    return Response.ok(row)

            def delete(self, request: Request) -> Response:
                with metrics.timer("api.handler_registrations.delete_ms"):
                    if not self._store.delete(int(request.params["id"])):
                        return Response.not_found("handler_registration")
                    return Response.ok({"deleted": True})


        class RunControlHandlers:
            """Non-CRUD verbs: trigger, cancel, and the run tail."""

            def __init__(self, conn: Connection, dispatcher):
                self._runs = JobRunStore(conn)
                self._dispatcher = dispatcher

            def trigger(self, request: Request) -> Response:
                inserted = self._dispatcher.enqueue_manual(int(request.params["id"]))
                if inserted is None:
                    return Response.not_found("job")
                return Response.created(inserted)

            def cancel(self, request: Request) -> Response:
                row = self._runs.update(int(request.params["id"]), {"state": "dead"})
                if row is None:
                    return Response.not_found("job_run")
                return Response.ok(row)

            def tail(self, request: Request) -> Response:
                """The most recent runs of a job, newest first."""
                rows = self._runs.list(job_id=int(request.params["id"]))
                return Response.ok(rows[::-1])
