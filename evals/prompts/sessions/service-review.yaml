            restored = AuditEvent.from_row(row)
            assert restored.id == 7
            assert restored.actor == original.actor


        def test_audit_event_validates_its_first_field():
            model = make_audit_event()
            model.actor = ""
            with pytest.raises(ValidationError):
                model.validate()


        def test_audit_event_store_crud_with_memory_store():
            store = MemoryStore()
            inserted = store.insert(make_audit_event().to_row())
            assert store.get(inserted['id']) == inserted
            assert store.list() == [inserted]
            updated = store.update(inserted['id'], {'recorded_at': None})
            assert updated is not None
            assert store.delete(inserted['id'])
            assert store.get(inserted['id']) is None

        def make_handler_registration(**overrides):
            base = HandlerRegistration(id=None, path="reports.jobs:nightly", owner_team="analytics", timeout_s=300, idempotent=True)
            for key, value in overrides.items():
                setattr(base, key, value)
            return base


        def test_handler_registration_roundtrips_through_a_row():
            original = make_handler_registration()
            row = original.to_row()
            row['id'] = 7
            restored = HandlerRegistration.from_row(row)
            assert restored.id == 7
            assert restored.path == original.path


        def test_handler_registration_validates_its_first_field():
            model = make_handler_registration()
            model.path = ""
            with pytest.raises(ValidationError):
                model.validate()


        def test_handler_registration_store_crud_with_memory_store():
            store = MemoryStore()
            inserted = store.insert(make_handler_registration().to_row())
            assert store.get(inserted['id']) == inserted
            assert store.list() == [inserted]
            updated = store.update(inserted['id'], {'idempotent': True})
            assert updated is not None
            assert store.delete(inserted['id'])
            assert store.get(inserted['id']) is None


        def test_next_run_at_advances_to_the_next_minute(monkeypatch):
            freeze_time(monkeypatch, "2025-06-01T02:59:30")
            schedule = make_schedule()
            fire = next_run_at(schedule)
            assert fire.hour == 3 and fire.minute == 0


        def test_next_run_at_honors_a_lower_bound(monkeypatch):
            freeze_time(monkeypatch, "2025-06-01T01:00:00")
            schedule = make_schedule()
            fire = next_run_at(schedule, after=datetime(2025, 6, 2, 3, 0))
            assert fire.day == 3


        def test_consumer_marks_a_missing_job_dead(monkeypatch):
            runs, jobs = MemoryStore(), MemoryStore()
            run = runs.insert({'job_id': 99, 'state': 'leased'})
            consumer = mock.Mock()
            consumer._runs, consumer._jobs = runs, jobs
            from cronwell.queue_consumer import Consumer
            Consumer._process(consumer, run)
            assert runs.get(run['id'])['state'] == 'dead'


        def test_retry_preview_is_monotonic():
            from cronwell.retry_policy import preview_schedule
            ladder = preview_schedule(200, 60000, 8)
            assert ladder == sorted(ladder)
            assert ladder[-1] == 25600
