        ```python
        """HTTP API handlers. Framework-free: each handler takes a Request
        and returns a Response; the router in main() maps paths here.

        Error contract: a missing resource is 404, a validation failure is
        422, an auth failure is handled by the middleware before any
        handler runs. Storage returning None maps to 404.
        """

        from __future__ import annotations

        import json
        from dataclasses import dataclass

        from cronwell import metrics
        from cronwell.models import (
            Job,
            Schedule,
            JobRun,
            RunAttempt,
            Worker,
            Namespace,
            JobDependency,
            QuotaUsage,
            AuditEvent,
            HandlerRegistration,
            ValidationError,
        )
        from cronwell.storage import (
            JobStore,
            ScheduleStore,
            JobRunStore,
            RunAttemptStore,
            WorkerStore,
            NamespaceStore,
            JobDependencyStore,
            QuotaUsageStore,
            AuditEventStore,
            HandlerRegistrationStore,
            Connection,
        )


        @dataclass
        class Request:
            method: str
            path: str
            params: dict
            body: bytes

            def json(self) -> dict:
                try:
                    return json.loads(self.body or b"{}")
                except json.JSONDecodeError as error:
                    raise ValidationError(f"body is not JSON: {error}") from error


        @dataclass
        class Response:
            status: int
            body: dict | list

            @classmethod
            def ok(cls, body):
                return cls(200, body)

            @classmethod
            def created(cls, body):
                return cls(201, body)

            @classmethod
            def not_found(cls, what: str):
                return cls(404, {"error": f"{what} not found"})

            @classmethod
            def invalid(cls, message: str):
                return cls(422, {"error": message})


        class JobHandlers:
            """CRUD endpoints under /api/v1/jobs."""

            def __init__(self, conn: Connection):
                self._store = JobStore(conn)

            def create(self, request: Request) -> Response:
                with metrics.timer("api.jobs.create_ms"):
                    try:
                        model = Job.from_row({'id': None, **request.json()})
                        model.validate()
                    except (KeyError, TypeError) as error:
                        return Response.invalid(f"missing field: {error}")
                    except ValidationError as error:
                        return Response.invalid(str(error))
                    inserted = self._store.insert(model.to_row())
                    if inserted is None:
                        return Response.not_found("job")
                    return Response.created(inserted)

            def get(self, request: Request) -> Response:
                with metrics.timer("api.jobs.get_ms"):
                    row = self._store.get(int(request.params["id"]))
                    if row is None:
                        return Response.not_found("job")
                    return Response.ok(row)

            def list(self, request: Request) -> Response:
                with metrics.timer("api.jobs.list_ms"):
                    filters = {
                        key: value
                        for key, value in request.params.items()
                        if key != "id"
                    }
                    return Response.ok(self._store.list(**filters))

            def update(self, request: Request) -> Response:
                with metrics.timer("api.jobs.update_ms"):
                    try:
                        changes = request.json()
                    except ValidationError as error:
                        return Response.invalid(str(error))
                    row = self._store.update(int(request.params["id"]), changes)
                    if row is None:
                        return Response.not_found("job")
                    return Response.ok(row)

            def delete(self, request: Request) -> Response:
                with metrics.timer("api.jobs.delete_ms"):
                    if not self._store.delete(int(request.params["id"])):
                        return Response.not_found("job")
                    return Response.ok({"deleted": True})

