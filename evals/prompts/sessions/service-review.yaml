# One coherent deep drift session. Contract:
#
# - `session.id` names the script, and the file name matches
#   "<id>.yaml".
# - `turns` is the ordered turn list. Every turn has a unique id and
#   a self-contained text: an answer needs no tools and no
#   repository.
# - Every script in prompts/sessions/ has the same turn count,
#   because the drift analysis pools by turn position across
#   sessions.
# - Later turns reference material from earlier turns by artifact
#   name, so the model must read deep context.
# - Changes to this file change the measurement. The provenance of a
#   deep run records the sha256 of every script file.

session:
  id: service-review
  description: A module-by-module code review of a job-scheduler service.
  turns:
    - id: turn-01
      text: |
        You are reviewing cronwell, a job-scheduler service, one module per
        turn. Review the domain models module below and point out every
        problem you find: correctness, contracts, and anything a later
        module could trip over. Note the documented invariants: you will
        check other modules against them.

        `cronwell/models.py`:

        ```python
        """Domain models of the cronwell scheduler.

        Every model validates itself on construction and converts to and
        from a storage row. Times are UTC everywhere; see next_run_at for
        the schedule arithmetic.
        """

        from __future__ import annotations

        from dataclasses import dataclass, field
        from datetime import datetime, timedelta
        from enum import Enum


        class RunState(str, Enum):
            PENDING = "pending"
            LEASED = "leased"
            RUNNING = "running"
            SUCCEEDED = "succeeded"
            FAILED = "failed"
            DEAD = "dead"


        class ValidationError(ValueError):
            """A model field breaks its contract."""


        # Defaults shared with the config schema. config_loader.py keeps
        # its own copy of these values for bootstrap; keep both in sync.
        DEFAULT_PRIORITY = 5
        DEFAULT_JITTER_S = 30
        DEFAULT_RETRY_BACKOFF_BASE_MS = 250
        DEFAULT_QUOTA_RUNS_PER_HOUR = 1200
        MAX_PAYLOAD_BYTES = 64 * 1024

        @dataclass
        class Job:
            """One job of the scheduler.

            Field contract mirrors the job table in storage.py;
            validate() enforces it before any write.
            """

            id: int | None
            name: str
            namespace: str
            handler: str
            payload: dict = field(default_factory=dict)
            priority: int = DEFAULT_PRIORITY
            enabled: bool = False

            def validate(self) -> None:
                if not self.name or len(self.name) > 255:
                    raise ValidationError("job.name must be 1..255 chars")
                if not self.namespace or len(self.namespace) > 255:
                    raise ValidationError("job.namespace must be 1..255 chars")
                if not self.handler or len(self.handler) > 255:
                    raise ValidationError("job.handler must be 1..255 chars")

            def to_row(self) -> dict:
                row = {
                    "name": self.name,
                    "namespace": self.namespace,
                    "handler": self.handler,
                    "payload": self.payload,
                    "priority": self.priority,
                    "enabled": self.enabled,
                }
                if self.id is not None:
                    row["id"] = self.id
                return row

            @classmethod
            def from_row(cls, row: dict) -> "Job":
                return cls(
                    id=row.get("id"),
                    name=row["name"],
                    namespace=row["namespace"],
                    handler=row["handler"],
                    payload=row["payload"],
                    priority=row["priority"],
                    enabled=row["enabled"],
                )

            def summary(self) -> str:
                """One log-friendly line; the audit trail stores this."""
                return (
                    f"job(id={self.id}, name={self.name!r}, namespace={self.namespace!r}, handler={self.handler!r}"
                    f")"
                )

            def changed_fields(self, other) -> list[str]:
                """Field names where self and other differ; audit uses this
                to record precise change sets instead of full rows.
                """
                if type(other) is not type(self):
                    raise ValidationError("cannot diff across model types")
                changed = []
                if self.name != other.name:
                    changed.append("name")
                if self.namespace != other.namespace:
                    changed.append("namespace")
                if self.handler != other.handler:
                    changed.append("handler")
                if self.payload != other.payload:
                    changed.append("payload")
                if self.priority != other.priority:
                    changed.append("priority")
                if self.enabled != other.enabled:
                    changed.append("enabled")
                return changed


