        ## Ops doc: delivery semantics (from the runbook)

        The runbook answer to 'was my job run lost?' walks three states.
        A run in state failed with a synthetic reaper attempt means the
        worker died mid-flight; the run is NOT redelivered - file a
        manual trigger if the handler is safe to repeat. A run in state
        dead exhausted its attempts; the attempt rows carry each error.
        A run stuck in running with a live worker heartbeat is still
        executing; the handler timeout in the registration bounds it.
        The runbook was written against the original design proposal,
        which promised 'the scheduler may run a job twice, never zero
        times silently'; operators report the reaper section above
        contradicts that promise in the mid-flight case, and the
        on-call rotation keeps a manual checklist for it. Redelivery
        after a retry decision goes through the pending set: the run
        returns with a future scheduled_for, the lease query picks it
        up, and the attempt history carries across because attempt_no
        derives from the stored attempts, not from memory. Nothing in
        this path consults the idempotent flag of the registration.

