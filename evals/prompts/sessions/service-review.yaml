           1  """Metrics: a small statsd client with counters, gauges, timers.
           2
           3  One UDP socket per process, one lock around it. Every emit formats
           4  and sends inline, so the caller pays the cost at the call site; there
           5  is no buffer and no background flusher, which keeps loss semantics
           6  trivial: a dropped UDP packet is a lost point, never a stall.
           7  """
