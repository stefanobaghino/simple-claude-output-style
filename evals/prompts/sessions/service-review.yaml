         102          module_name, _, func_name = path.partition(":")
         103          if not module_name or not func_name:
         104              raise HandlerNotFound(f"handler path must be module:function, got {path!r}")
         105          try:
         106              module = importlib.import_module(module_name)
         107          except ImportError as error:
         108              raise HandlerNotFound(f"cannot import {module_name!r}") from error
         109          handler = getattr(module, func_name, None)
         110          if handler is None or not callable(handler):
         111              raise HandlerNotFound(f"{path!r} is not a callable")
         112          return handler
         113
         114
         115  class Reaper:
         116      """Finalizes runs whose worker died between ack and completion.
         117
         118      A run in state running with no attendant heartbeat for the grace
         119      window is marked failed with a synthetic attempt row, so the run
         120      history shows the loss. The reaper never re-enqueues: the delivery
         121      contract is at-most-once, and a lost attempt stays lost unless the
         122      retry policy independently schedules a new attempt.
