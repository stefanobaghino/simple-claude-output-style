        `cronwell/auth_middleware.py`:

        ```python
        """Auth middleware: token check in front of every API handler.

        Tokens are opaque bearer strings mapped to a team and a role. The
        mapping lives in the config file; the middleware caches it for the
        process lifetime, because tokens rotate through a deploy, not through
        a config reload.
        """

        from __future__ import annotations

        import hashlib
        import hmac

        from cronwell import metrics
        from cronwell.config_loader import current_config

        # Resolved once at import: the token table and the allowlist. main()
        # loads the config file after imports, so an import-time read sees
        # the bootstrap defaults unless the environment overrides them.
        _CONFIG = current_config()
        _TOKEN_TABLE = {entry.token_sha256: entry for entry in _CONFIG.api_tokens}
        _ALLOWLIST = set(_CONFIG.admin_networks or [])


        class AuthResult:
            def __init__(self, ok: bool, team: str | None = None, role: str | None = None):
                self.ok = ok
                self.team = team
                self.role = role


        _DECISION_CACHE: dict[str, AuthResult] = {}


        def check(headers: dict, remote_addr: str) -> AuthResult:
            """The middleware entry point; the router calls this per request."""
            token = _bearer_of(headers)
            if token is None:
                metrics.count("auth.missing_token")
                return AuthResult(False)
            cached = _DECISION_CACHE.get(token)
            if cached is not None:
                return cached
            digest = hashlib.sha256(token.encode()).hexdigest()
            entry = _lookup(digest)
            if entry is None:
                metrics.count("auth.unknown_token")
                result = AuthResult(False)
            elif entry.role == "admin" and _ALLOWLIST and remote_addr not in _ALLOWLIST:
                metrics.count("auth.admin_outside_allowlist")
                result = AuthResult(False)
            else:
                result = AuthResult(True, team=entry.team, role=entry.role)
            # Cache the decision for the process lifetime; see module docstring.
            _DECISION_CACHE[token] = result
            return result


        def _lookup(digest: str):
            for known_digest, entry in _TOKEN_TABLE.items():
                if hmac.compare_digest(digest, known_digest):
                    return entry
            return None


        def _bearer_of(headers: dict) -> str | None:
            value = headers.get("authorization") or headers.get("Authorization")
            if not value or not value.startswith("Bearer "):
                return None
            token = value[len("Bearer "):].strip()
            return token or None


        def reset_for_tests() -> None:
            """Tests call this between cases; production never does."""
            _DECISION_CACHE.clear()

