        ```python
        """The queue consumer: turns leased runs into handler calls.

        Delivery contract: a run is acked (marked running and committed) as
        soon as the worker takes it, then the handler executes. Handlers must
        therefore be idempotent: a crash between ack and completion loses the
        in-flight attempt, and the run is finalized by the reaper, not
        redelivered.
        """

        from __future__ import annotations

        import importlib
        import time
        import traceback
        from datetime import datetime, timezone

        from cronwell import metrics
        from cronwell.models import RunState
        from cronwell.retry_policy import RetryPolicy
        from cronwell.storage import Connection, JobStore, JobRunStore, LeaseStore, RunAttemptStore


        class HandlerNotFound(RuntimeError):
            """The job names a handler that no module exports."""


        class Consumer:
            """One consumer loop per worker process."""

            def __init__(self, conn: Connection, worker_id: str, batch: int = 16):
                self._runs = JobRunStore(conn)
                self._jobs = JobStore(conn)
                self._attempts = RunAttemptStore(conn)
                self._lease = LeaseStore(conn)
                self._retry = RetryPolicy.from_config()
                self._worker_id = worker_id
                self._batch = batch
                self._running = True

            def stop(self) -> None:
                self._running = False

            def run_forever(self, poll_interval_s: float = 1.0) -> None:
                while self._running:
                    leased = self._lease.lease_due_runs(self._worker_id, self._batch)
                    if not leased:
                        time.sleep(poll_interval_s)
                        continue
                    for run in leased:
                        self._process(run)

            def _process(self, run: dict) -> None:
                # Ack first: the run leaves the pending set before the handler
                # starts, so a duplicate lease cannot double-run it.
                self._runs.update(run["id"], {
                    "state": RunState.RUNNING.value,
                    "started_at": datetime.now(timezone.utc),
                })
                job = self._jobs.get(run["job_id"])
                if job is None or not job["enabled"]:
                    self._runs.update(run["id"], {"state": RunState.DEAD.value})
                    metrics.count("consumer.skipped_disabled")
                    return
                attempt_no = self._attempts.next_attempt_no(run["id"])
                started = time.monotonic()
                try:
                    handler = self._resolve(job["handler"])
                    with metrics.timer("consumer.handler_ms", tags={"job": job["name"]}):
                        handler(job["payload"])
                except Exception as error:  # noqa: BLE001 - the boundary logs everything
                    duration_ms = int((time.monotonic() - started) * 1000)
                    self._attempts.insert({
                        "run_id": run["id"], "attempt_no": attempt_no,
                        "worker_id": self._worker_id,
                        "error": "".join(traceback.format_exception_only(error)).strip(),
                        "duration_ms": duration_ms,
                    })
                    decision = self._retry.decide(attempt_no)
                    if decision.give_up:
                        self._runs.update(run["id"], {"state": RunState.DEAD.value})
                        metrics.count("consumer.dead")
                    else:
                        # Hand the run back to the retry path; the policy
                        # schedules the next attempt.
                        self._retry.reschedule(self._runs, run, decision)
                        metrics.count("consumer.retried")
                    return
                duration_ms = int((time.monotonic() - started) * 1000)
                self._attempts.insert({
                    "run_id": run["id"], "attempt_no": attempt_no,
                    "worker_id": self._worker_id, "error": None,
                    "duration_ms": duration_ms,
                })
                self._runs.update(run["id"], {
                    "state": RunState.SUCCEEDED.value,
                    "finished_at": datetime.now(timezone.utc),
                })
                metrics.count("consumer.succeeded")

            def _resolve(self, path: str):
                """Import "pkg.module:function" and return the callable."""
                module_name, _, func_name = path.partition(":")
                if not module_name or not func_name:
                    raise HandlerNotFound(f"handler path must be module:function, got {path!r}")
                try:
                    module = importlib.import_module(module_name)
                except ImportError as error:
                    raise HandlerNotFound(f"cannot import {module_name!r}") from error
                handler = getattr(module, func_name, None)
                if handler is None or not callable(handler):
                    raise HandlerNotFound(f"{path!r} is not a callable")
                return handler


        class Reaper:
            """Finalizes runs whose worker died between ack and completion.

            A run in state running with no attendant heartbeat for the grace
            window is marked failed with a synthetic attempt row, so the run
            history shows the loss. The reaper never re-enqueues: the delivery
            contract is at-most-once, and a lost attempt stays lost unless the
            retry policy independently schedules a new attempt.
            """

            GRACE_S = 120

            def __init__(self, conn: Connection):
                self._conn = conn

            def sweep(self) -> int:
                rows = self._conn.execute(
                    "UPDATE job_runs SET state = 'failed' "
                    "WHERE state = 'running' AND worker_id IN ("
                    "SELECT hostname FROM workers "
                    "WHERE last_heartbeat_at < now() - interval '%s seconds') "
                    "RETURNING id",
                    (self.GRACE_S,),
                )
                if rows:
                    metrics.count("reaper.swept", len(rows))
                return len(rows)

        ```

