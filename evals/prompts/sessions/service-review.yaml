      text: |
        Architectural assessment. Below is the architecture overview from
        the service handbook, with the original design tenets and the
        known pressure points from operations. Write the closing
        assessment of the review: which design tenets does the
        implementation actually uphold, and which does it break? Tie each
        broken tenet to the specific findings that break it (the delivery
        contract conflict between the queue consumer and the retry
        policy, the naive datetime in the models module, the import-time
        config read in the auth middleware), explain which operational
        pressure point each finding plausibly caused, and end with the
        three changes you would make first and why.

        ## cronwell architecture overview (from the service handbook)

        cronwell schedules and executes background jobs for every product
        team. One scheduler instance is elected leader and runs the
        dispatcher; every instance runs an API server; workers run the
        queue consumer. State lives entirely in postgres: jobs,
        schedules, runs, attempts, workers, namespaces. The dispatcher
        materializes due runs from schedules; consumers lease runs with
        FOR UPDATE SKIP LOCKED; the reaper finalizes runs lost to dead
        workers.

        Design tenets, quoted from the original proposal: (1) postgres
        is the only stateful dependency, so operational knowledge
        transfers; (2) delivery is at-least-once and handlers are
        idempotent - 'the scheduler may run a job twice, never zero
        times silently'; (3) every timestamp is UTC and timezone-aware
        end to end; (4) the control plane (API, dispatcher) degrades
        independently of the data plane (consumers draining leased
        runs).

        Deployment topology: 3 scheduler instances behind the API load
        balancer, 12 workers in two zones, one primary postgres with a
        sync replica. Scale numbers from last quarter: 41k schedules,
        1.1M runs/day, p99 dispatch-to-start 8.2 s, handler p99 44 s.

        Known pressure points from the ops review: dispatch-to-start
        latency spikes during API trigger storms; a metrics-host DNS
        outage in March slowed consumers fleet-wide; the June token
        rotation locked out the deploy tooling until instances were
        restarted, cause unconfirmed at the time.

        Attached code segments the assessment must cite:

