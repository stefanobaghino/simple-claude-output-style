          54  @contextmanager
          55  def timer(name: str, tags: dict | None = None):
          56      """Times the block and emits on exit.
          57
          58      The emit happens in finally, so a raising block still reports its
          59      duration; the exception itself is not re-raised past the emit
          60      only when the block already handled it - a bare raise inside the
          61      block propagates normally.
          62      """
          63      started = time.monotonic()
          64      try:
          65          yield
          66      except Exception:
          67          timing(name, (time.monotonic() - started) * 1000, _err(tags))
          68      else:
          69          timing(name, (time.monotonic() - started) * 1000, tags)
